<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Virrdor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  :root {
    --bg: #1e1f22; --panel: #27292d; --panel-edge: #33363b;
    --text: #dcdad6; --text-dim: #86898f;
    --p1: #c96b5c; --p2: #6b90b8;
    --p1-soft: #3a2b28; --p2-soft: #2a3340;
    --gold: #e8c96a; --danger: #d9534f; --disabled: #3a3d43;
    --boom: #f0b429;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif; color: var(--text); touch-action: none; overscroll-behavior: none; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .4s ease; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
  .screen.active { opacity: 1; pointer-events: auto; }

  .centered { align-items: center; justify-content: center; padding: 30px; text-align: center; }
  .spinner-big { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--p1); border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .centered .msg { font-size: 15px; color: var(--text-dim); max-width: 300px; line-height: 1.5; }
  .centered .title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
  .error-actions { margin-top: 24px; display: flex; justify-content: center; width: 100%; max-width: 320px; }
  .error-actions .btn { min-width: 180px; }

  .game { display: flex; flex-direction: column; }
  .board-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; min-height: 0; background: var(--bg); }
  .board-wrap { position: relative; touch-action: none; }
  canvas { display: block; border-radius: 14px; background: #2a2d32; }

  .obs-badge {
    position: absolute;
    top: 22px;
    right: 22px;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    background: rgba(20, 21, 24, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    z-index: 10;
    cursor: pointer;
    user-select: none;
    font-variant-numeric: tabular-nums;
    transition: transform .12s ease;
  }
  .obs-badge:active { transform: scale(0.94); }
  .obs-badge.visible { display: inline-flex; }
  .obs-badge .eye { width: 16px; height: 16px; opacity: 0.85; flex-shrink: 0; }
  .obs-badge .cnt { color: var(--text); line-height: 1; padding: 0 2px; }
  .obs-stack { display: flex; align-items: center; padding-left: 4px; }
  .obs-stack .obs-ava { width: 20px; height: 20px; border-radius: 50%; margin-left: -7px; border: 2px solid rgba(20, 21, 24, 0.9); overflow: hidden; flex-shrink: 0; background: #3a3d43; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #1e1f22; }
  .obs-stack .obs-ava:first-child { margin-left: 0; }
  .obs-stack .obs-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .panel { flex: 0 0 auto; background: var(--panel); display: flex; flex-direction: column; padding: 8px 10px; gap: 8px; position: relative; z-index: 5; transition: background .3s; }
  .enemy-panel { border-bottom: 1px solid var(--panel-edge); }
  .my-panel { border-top: 1px solid var(--panel-edge); }
  .enemy-panel.active-1, .my-panel.active-1 { background: #2b2927; }
  .enemy-panel.active-2, .my-panel.active-2 { background: #262a30; }

  .panel-head { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #1e1f22; transition: transform .25s; overflow: hidden; position: relative; }
  .avatar.me-1 { background: var(--p1); }
  .avatar.me-2 { background: var(--p2); }
  .avatar.active { transform: scale(1.08); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .panel-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .panel-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-turn { font-size: 11px; font-weight: 600; color: var(--text-dim); opacity: 0; transition: opacity .2s; letter-spacing: 0.4px; text-transform: uppercase; }
  .panel-turn.show { opacity: 1; }
  .enemy-panel.active-1 .panel-turn, .my-panel.active-1 .panel-turn { color: var(--p1); }
  .enemy-panel.active-2 .panel-turn, .my-panel.active-2 .panel-turn { color: var(--p2); }

  .panel-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .flag-btn { width: 34px; height: 34px; border-radius: 10px; background: transparent; border: none; color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s, color .2s; flex-shrink: 0; }
  .flag-btn:hover { background: #33363b; color: var(--danger); }
  .flag-btn:active { transform: scale(0.94); }
  .flag-btn svg { width: 18px; height: 18px; }
  .flag-btn.hidden { display: none; }

  .stat-row { display: flex; align-items: center; gap: 10px; }
  .stat-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px 6px; }
  .stat-group.bombs { grid-template-columns: repeat(3, 1fr); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #3a3d43; justify-self: center; transition: background .25s; }
  .dot.me-1 { background: var(--p1); }
  .dot.me-2 { background: var(--p2); }
  .dot.bomb { background: var(--boom); }
  .dot.bomb.empty { background: #3a3d43; }

  .draggables { display: flex; gap: 8px; margin-top: 2px; }
  .draggables.hidden { display: none; }
  .drag-item { flex: 1; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; position: relative; transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s; }
  .drag-item:active { transform: scale(0.92); opacity: 0.7; }
  .drag-item.me-1 { background: var(--p1-soft); box-shadow: inset 0 0 0 1.5px rgba(201,107,92,0.4); }
  .drag-item.me-1 .icon { background: var(--p1); }
  .drag-item.me-2 { background: var(--p2-soft); box-shadow: inset 0 0 0 1.5px rgba(107,144,184,0.4); }
  .drag-item.me-2 .icon { background: var(--p2); }
  .drag-item.disabled { opacity: 0.25; pointer-events: none; }
  .drag-item .icon { width: 60px; height: 7px; border-radius: 4px; }
  .drag-item.vertical .icon { width: 7px; height: 60px; }

  .drag-item .sending-overlay { position: absolute; inset: 0; border-radius: 14px; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; }
  .drag-item.sending .sending-overlay { display: flex; animation: sendingPulse 0.7s ease-in-out infinite alternate; }
  @keyframes sendingPulse { from { background: rgba(0,0,0,0.15); } to { background: rgba(0,0,0,0.45); } }
  .drag-item .sending-overlay .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }

  .my-panel.sending { animation: panelFlash 0.6s ease-in-out infinite alternate; }
  @keyframes panelFlash { from { background: var(--panel); } to { background: #303339; } }

  .bomb-btn {
    width: 100%; height: 54px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #e8c96a;
    background: rgba(240, 180, 41, 0.12);
    box-shadow: inset 0 0 0 1.5px rgba(240, 180, 41, 0.35);
    cursor: pointer;
    transition: transform .12s, background .2s;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
  }
  .bomb-btn:active { transform: scale(0.97); }
  .bomb-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .bomb-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .bomb-btn .cnt { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 17px; }
  .bomb-btn.hidden { display: none; }

  .win-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 30px 24px; overflow: hidden; background: radial-gradient(ellipse at 50% 25%, rgba(232,201,106,0.10), transparent 60%), radial-gradient(ellipse at 50% 100%, rgba(201,107,92,0.06), transparent 60%), var(--bg); opacity: 0; pointer-events: none; transition: opacity .45s ease; z-index: 50; }
  .win-screen.show { opacity: 1; pointer-events: auto; }

  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; opacity: 0.9; animation: fall linear infinite; }
  .confetti i:nth-child(1) { left:  5%; background:#e8c96a; animation-duration: 4.2s; animation-delay: -0.4s; transform: rotate(20deg); }
  .confetti i:nth-child(2) { left: 12%; background:#c96b5c; animation-duration: 5.1s; animation-delay: -1.8s; transform: rotate(80deg); }
  .confetti i:nth-child(3) { left: 19%; background:#6b90b8; animation-duration: 3.8s; animation-delay: -0.9s; transform: rotate(140deg); }
  .confetti i:nth-child(4) { left: 27%; background:#e8c96a; animation-duration: 5.4s; animation-delay: -2.3s; transform: rotate(60deg); }
  .confetti i:nth-child(5) { left: 34%; background:#dcdad6; animation-duration: 4.6s; animation-delay: -1.1s; transform: rotate(30deg); }
  .confetti i:nth-child(6) { left: 41%; background:#c96b5c; animation-duration: 5.8s; animation-delay: -3.0s; transform: rotate(120deg); }
  .confetti i:nth-child(7) { left: 48%; background:#6b90b8; animation-duration: 4.0s; animation-delay: -0.6s; transform: rotate(75deg); }
  .confetti i:nth-child(8) { left: 55%; background:#e8c96a; animation-duration: 5.0s; animation-delay: -2.7s; transform: rotate(200deg); }
  .confetti i:nth-child(9) { left: 62%; background:#dcdad6; animation-duration: 4.4s; animation-delay: -1.5s; transform: rotate(45deg); }
  .confetti i:nth-child(10){ left: 69%; background:#c96b5c; animation-duration: 5.6s; animation-delay: -0.2s; transform: rotate(170deg); }
  .confetti i:nth-child(11){ left: 76%; background:#6b90b8; animation-duration: 4.8s; animation-delay: -2.0s; transform: rotate(90deg); }
  .confetti i:nth-child(12){ left: 83%; background:#e8c96a; animation-duration: 5.2s; animation-delay: -3.4s; transform: rotate(230deg); }
  .confetti i:nth-child(13){ left: 90%; background:#dcdad6; animation-duration: 4.1s; animation-delay: -1.9s; transform: rotate(110deg); }
  .confetti i:nth-child(14){ left: 96%; background:#c96b5c; animation-duration: 5.5s; animation-delay: -2.6s; transform: rotate(55deg); }
  .confetti i:nth-child(15){ left:  8%; background:#6b90b8; animation-duration: 6.0s; animation-delay: -4.1s; transform: rotate(15deg); }
  .confetti i:nth-child(16){ left: 25%; background:#e8c96a; animation-duration: 6.3s; animation-delay: -3.7s; transform: rotate(160deg); }
  .confetti i:nth-child(17){ left: 42%; background:#c96b5c; animation-duration: 5.9s; animation-delay: -4.5s; transform: rotate(95deg); }
  .confetti i:nth-child(18){ left: 58%; background:#6b90b8; animation-duration: 6.6s; animation-delay: -3.2s; transform: rotate(210deg); }
  .confetti i:nth-child(19){ left: 74%; background:#e8c96a; animation-duration: 6.1s; animation-delay: -4.8s; transform: rotate(40deg); }
  .confetti i:nth-child(20){ left: 88%; background:#dcdad6; animation-duration: 6.4s; animation-delay: -3.9s; transform: rotate(130deg); }
  @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 0; } 10% { opacity: 0.9; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0.85; } }

  .win-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 420px; flex: 1; justify-content: center; padding: 20px 0; min-height: 0; }
  .winner-block { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 34px; }
  .winner-avatar-wrap { position: relative; width: 116px; height: 116px; display: flex; align-items: center; justify-content: center; }
  .winner-avatar { width: 116px; height: 116px; border-radius: 50%; background: #2e3136; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800; color: #1e1f22; box-shadow: 0 0 0 5px var(--p1), 0 0 0 9px rgba(232,201,106,0.35), 0 20px 44px rgba(0,0,0,0.55); position: relative; z-index: 2; }
  .winner-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .winner-avatar.is-p2 { box-shadow: 0 0 0 5px var(--p2), 0 0 0 9px rgba(232,201,106,0.35), 0 20px 44px rgba(0,0,0,0.55); }
  .crown { position: absolute; top: -32px; left: 50%; transform: translateX(-50%); width: 66px; height: 48px; z-index: 3; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45)); animation: crownFloat 2.8s ease-in-out infinite; }
  @keyframes crownFloat { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-4px); } }
  .winner-label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .winner-name { font-size: 28px; font-weight: 800; color: var(--text); text-align: center; letter-spacing: -0.3px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loser-block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .loser-avatar { width: 58px; height: 58px; border-radius: 50%; background: #2e3136; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #1e1f22; box-shadow: 0 0 0 3px rgba(134,137,143,0.35), 0 8px 20px rgba(0,0,0,0.4); }
  .loser-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .loser-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
  .loser-name { font-size: 13px; color: var(--text-dim); font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .win-footer { position: relative; z-index: 2; width: 100%; max-width: 420px; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .btn-close { width: 100%; border: none; font-family: inherit; font-size: 16px; font-weight: 700; padding: 16px 20px; border-radius: 14px; cursor: pointer; color: #1e1f22; background: var(--gold); transition: transform .1s, background .2s; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  .btn-close:active { transform: scale(0.98); }
  .btn-share { width: 100%; border: none; font-family: inherit; font-size: 15px; font-weight: 700; padding: 15px 20px; border-radius: 14px; cursor: pointer; color: var(--text); background: transparent; box-shadow: inset 0 0 0 1.5px var(--panel-edge); transition: transform .1s, background .2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-share:active { transform: scale(0.98); }
  .btn-share svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .replay-screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
  .replay-header { flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--panel-edge); display: flex; flex-direction: column; }
  .players-row { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 360px; margin: 0 auto; padding: 12px 16px; }
  .player-chip { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 24px; background: #2e3136; min-width: 0; flex: 1; max-width: 160px; border: 2px solid transparent; transition: border-color .2s; }
  .player-chip.right { flex-direction: row-reverse; padding: 4px 4px 4px 12px; }
  .player-chip .pavatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #1e1f22; overflow: hidden; }
  .player-chip .pavatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .player-chip .pname { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .players-vs { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; flex-shrink: 0; }
  .replay-mode-tag { text-align: center; font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; padding-bottom: 8px; }

  .replay-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; }
  .replay-body .board-area { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .replay-body canvas { border-radius: 14px; background: #2a2d32; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }

  .replay-footer { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--panel-edge); display: flex; flex-direction: column; position: relative; }
  .replay-progress { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: transparent; }
  .replay-progress .bar { height: 100%; background: var(--gold); transition: width .25s ease; width: 0%; }

  .moves-list { display: flex; gap: 8px; padding: 12px 14px; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; background: #232529; }
  .moves-list::-webkit-scrollbar { display: none; }
  .move-chip { flex-shrink: 0; padding: 6px 12px; border-radius: 10px; background: #2e3136; color: #b5b8bd; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: 0.2px; transition: background .2s, color .2s, transform .2s; display: inline-flex; align-items: center; }
  .move-chip.current { background: #3d4046; color: #e6e4e0; transform: scale(1.04); }
  .move-chip.future { color: #6f7278; }
  .move-chip .move-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }

  .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px 12px 20px; }
  .nav-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: #33363b; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .12s, background .2s, color .2s; flex-shrink: 0; }
  .nav-btn:active:not(:disabled) { transform: scale(0.94); }
  .nav-btn:disabled { background: transparent; color: var(--disabled); box-shadow: inset 0 0 0 1.5px var(--panel-edge); cursor: not-allowed; }
  .nav-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .nav-counter { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; }
  .nav-counter .current { font-size: 22px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
  .nav-counter .current .sep { color: var(--text-dim); margin: 0 6px; font-weight: 600; }
  .nav-counter .current .total { color: var(--text-dim); font-weight: 600; }
  .nav-counter .label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); font-weight: 600; margin-top: 2px; }

  .share-row { padding: 0 20px 20px 20px; }
  .btn-share-replay {
    width: 100%;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 20px;
    border-radius: 14px;
    cursor: pointer;
    color: var(--text);
    background: transparent;
    box-shadow: inset 0 0 0 1.5px var(--panel-edge);
    transition: transform .1s, background .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-share-replay:active { transform: scale(0.98); }
  .btn-share-replay svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .dialog-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 200; padding: 20px; }
  .dialog-backdrop.show { opacity: 1; pointer-events: auto; }
  .dialog { background: var(--panel); border-radius: 20px; padding: 26px 24px; width: 100%; max-width: 340px; transform: scale(0.92); transition: transform .25s; box-shadow: 0 20px 60px rgba(0,0,0,0.6); text-align: center; }
  .dialog-backdrop.show .dialog { transform: scale(1); }
  .dialog-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .dialog-text { font-size: 14px; color: var(--text-dim); line-height: 1.45; margin-bottom: 20px; }
  .dialog-actions { display: flex; gap: 10px; }

<script>
(function(){
  const API_BASE = 'https://api.vidokl.xyz';
  const N = 9;
  const WALLS_PER_PLAYER = 10;
  const MAX_BOMBS = 3;
  const DIRS_ORTHO = [[-1,0],[1,0],[0,-1],[0,1]];
  const DIRS_DIAG = [[-1,-1],[-1,1],[1,-1],[1,1]];
  const COLOR_P1 = '#c96b5c';
  const COLOR_P2 = '#6b90b8';
  const POLL_INTERVAL = 700;
