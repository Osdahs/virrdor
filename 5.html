  const TELEPORT_DURATION = 380;
  const EVENT_GAP = 40;
  const FINGER_OFFSET_Y = 40;
  const LERP_FACTOR = 0.35;
  const DRAG_MOVE_THRESHOLD = 5;

  const MODE_NAMES = {
    classic: 'Классическая',
    free: 'Свободная',
    plates: 'Плитки',
    infinite_walls: 'Бесконечные стены',
    bombs: 'Бомба',
    arrows: 'Стрелки',
  };

  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
  function easeInOutQuad(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function chess(r, c) { return String.fromCharCode(97 + c) + (N - r); }

  let myPlayer = null;
  let isObserver = false;
  let roomCode = null;
  let mode = 'game';
  let gameMode = 'classic';
  let state = null;
  let pollTimer = null;
  let dragState = null;
  let pieceAnim = { p1: null, p2: null };
  let teleportAnim = null;
  let explosions = [];
  let wallExplosions = [];
  let eventQueue = [];
  let eventPlaying = false;
  let visualP1 = [0, 0];
  let visualP2 = [0, 0];
  let lastAnimatedTurnIndex = 0;
  let animRaf = null;
  let sending = false;
  let myUser = null;
  let playersMeta = {};
  let observersList = [];
  let lastGameOverShown = false;
  let wallOwnerMap = new Map();

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#1e1f22'); tg.setBackgroundColor('#1e1f22'); } catch (e) {}
  }

  function getViewAsPlayer() {
    if (isObserver) return 1;
    return myPlayer || 1;
  }
  function toViewR(r) { const v = getViewAsPlayer(); return v === 1 ? r : N - 1 - r; }
  function toViewC(c) { const v = getViewAsPlayer(); return v === 1 ? c : N - 1 - c; }
  function fromViewR(r) { const v = getViewAsPlayer(); return v === 1 ? r : N - 1 - r; }
  function fromViewC(c) { const v = getViewAsPlayer(); return v === 1 ? c : N - 1 - c; }
  function toViewDir(dir) {
    const v = getViewAsPlayer();
    if (v === 1) return dir;
    return { up: 'down', down: 'up', left: 'right', right: 'left' }[dir];
  }

  const screens = {
    loading: document.getElementById('screen-loading'),
    waiting: document.getElementById('screen-waiting'),
    error:   document.getElementById('screen-error'),
    game:    document.getElementById('screen-game'),
    replay:  document.getElementById('screen-replay'),
  };
  const loadingMsg = document.getElementById('loadingMsg');
  const errorTitle = document.getElementById('errorTitle');
  const errorMsg = document.getElementById('errorMsg');
  const errorActions = document.getElementById('errorActions');
  const waitingMsg = document.getElementById('waitingMsg');
  const waitingTitle = document.getElementById('waitingTitle');

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  const myAvatar = document.getElementById('myAvatar');
  const myPanel = document.getElementById('myPanel');
  const myTurn = document.getElementById('myTurn');
  const myDotsEl = document.getElementById('myDots');
  const myBombsEl = document.getElementById('myBombs');
  const myName = document.getElementById('myName');
  const myDrags = document.getElementById('myDrags');

  const enemyPanel = document.getElementById('enemyPanel');
  const enemyAvatar = document.getElementById('enemyAvatar');
  const enemyName = document.getElementById('enemyName');
  const enemyTurn = document.getElementById('enemyTurn');
  const enemyDotsEl = document.getElementById('enemyDots');
  const enemyBombsEl = document.getElementById('enemyBombs');

  const btnSurrender = document.getElementById('btnSurrender');
  const btnBomb = document.getElementById('btnBomb');
  const bombCnt = document.getElementById('bombCnt');

  const obsBadge = document.getElementById('obsBadge');
  const obsStack = document.getElementById('obsStack');
  const obsCount = document.getElementById('obsCount');

  const winScreen = document.getElementById('screen-win');
  const winnerAvatarEl = document.getElementById('winnerAvatar');
  const winnerNameEl = document.getElementById('winnerName');
  const loserAvatarEl = document.getElementById('loserAvatar');
  const loserNameEl = document.getElementById('loserName');
  const btnWinClose = document.getElementById('btnWinClose');
  const btnWinShare = document.getElementById('btnWinShare');

  const dialog = document.getElementById('dialog');
  const dialogTitle = document.getElementById('dialogTitle');
  const dialogText = document.getElementById('dialogText');
  const dialogActions = document.getElementById('dialogActions');

  let CELL = 0, PAD = 0, WALL_THICK = 0;
  function resizeCanvas() {
    const area = canvas.closest('.board-area');
    const rect = area.getBoundingClientRect();
    const size = Math.min(rect.width - 20, rect.height - 20);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    PAD = size * 0.04;
    CELL = (size - PAD * 2) / N;
    WALL_THICK = Math.max(4, CELL * 0.14);
  }

  async function api(path, opts = {}) {
    const res = await fetch(API_BASE + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      const e = new Error((data && data.error) || ('HTTP ' + res.status));
      e.status = res.status;
      e.data = data;
      e.replayId = data && data.replayId;
      throw e;
    }
    return data;
  }

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }
  function showError(title, msg) {
    errorTitle.textContent = title;
    errorMsg.textContent = msg;
    errorActions.innerHTML = '';
    showScreen('error');
  }
  function showErrorWithReplay(title, msg, replayId) {
    errorTitle.textContent = title;
    errorMsg.textContent = msg;
    errorActions.innerHTML = '';
    if (replayId) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = 'Смотреть повтор';
      btn.addEventListener('click', () => loadReplayInline(replayId));
      errorActions.appendChild(btn);
    }
    showScreen('error');
  }
  function showDialog(options) {
    dialogTitle.textContent = options.title || '';
    dialogText.textContent = options.text || '';
    dialogActions.innerHTML = '';
    const oldList = dialog.querySelector('.obs-popup-list');
    if (oldList) oldList.remove();
    const buttons = options.buttons || [{ label: 'ОК', primary: true }];
    buttons.forEach(btnOpt => {
      const b = document.createElement('button');
      b.className = 'btn ' + (btnOpt.danger ? 'btn-danger' : (btnOpt.primary ? 'btn-primary' : 'btn-secondary'));
      b.textContent = btnOpt.label;
      b.addEventListener('click', () => {
        if (btnOpt.closeAfter !== false) hideDialog();
        if (btnOpt.onClick) btnOpt.onClick();
      });
      dialogActions.appendChild(b);
    });
    dialog.classList.add('show');
  }
  function hideDialog() {
    dialog.classList.remove('show');
    const oldList = dialog.querySelector('.obs-popup-list');
    if (oldList) oldList.remove();
  }

  function showObserversPopup() {
    dialogTitle.textContent = 'Наблюдатели';
    dialogText.textContent = '';
    dialogActions.innerHTML = '';
    const list = document.createElement('div');
    list.className = 'obs-popup-list';
    if (!observersList.length) {
      const empty = document.createElement('div');
      empty.className = 'obs-popup-item';
      empty.textContent = 'Пока никого';
      list.appendChild(empty);
    } else {
      observersList.forEach(o => {
        const item = document.createElement('div');
        item.className = 'obs-popup-item';
        const ava = document.createElement('div');
        ava.className = 'op-ava';
        if (o.photo) ava.innerHTML = `<img src="${o.photo}" alt="" referrerpolicy="no-referrer">`;
        else ava.textContent = (o.name || '?').charAt(0).toUpperCase();
        const name = document.createElement('div');
        name.className = 'op-name';
        name.textContent = o.name || 'Наблюдатель';
        item.appendChild(ava);
        item.appendChild(name);
        list.appendChild(item);
      });
    }
    dialog.querySelector('.dialog').insertBefore(list, dialogActions);
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn btn-primary';
    closeBtn.textContent = 'Закрыть';
    closeBtn.addEventListener('click', hideDialog);
    dialogActions.appendChild(closeBtn);
    dialog.classList.add('show');
  }

  // ============================================================
  // ГЕОМЕТРИЯ
  // ============================================================
  function wallKey(t, r, c) { return `${t}:${r}:${c}`; }
  function parseWallKey(k) {
    const parts = k.split(':');
    return { type: parts[0], r: +parts[1], c: +parts[2], player: parts.length > 3 ? +parts[3] : null };
  }
  function wallExists(t, r, c) {
    if (!state) return false;
    return state.walls.some(k => {
      const w = parseWallKey(k);
      return w.type === t && w.r === r && w.c === c;
    });
  }
  function _hEdgeBlocked(r, cL) {
    if (wallExists('V', r, cL)) return true;
    if (wallExists('V', r - 1, cL)) return true;
    return false;
  }
  function _vEdgeBlocked(rT, c) {
    if (wallExists('H', rT, c)) return true;
    if (wallExists('H', rT, c - 1)) return true;
    return false;
  }
  function isBlocked(r1, c1, r2, c2) {
    const dr = r2 - r1;
    const dc = c2 - c1;
    if (dr === 0 && dc !== 0) return _hEdgeBlocked(r1, Math.min(c1, c2));
    if (dc === 0 && dr !== 0) return _vEdgeBlocked(Math.min(r1, r2), c1);
    if (dr !== 0 && dc !== 0) {
      const mr = Math.min(r1, r2);
      const mc = Math.min(c1, c2);
      const path1_open = (!_hEdgeBlocked(r1, mc) && !_vEdgeBlocked(mr, c2));
      const path2_open = (!_vEdgeBlocked(mr, c1) && !_hEdgeBlocked(r2, mc));
      return !(path1_open || path2_open);
    }
    return false;
  }
  function isPlate(r, c) {
    if (!state || !state.plates) return false;
    return state.plates.some(([pr, pc]) => pr === r && pc === c);
  }

  function bfsHasPath(startR, startC, targetRow, allowDiag, extraWallKey) {
    const visited = Array.from({ length: N }, () => new Array(N).fill(false));
    const queue = [[startR, startC]];
    visited[startR][startC] = true;
    const dirs = allowDiag ? DIRS_ORTHO.concat(DIRS_DIAG) : DIRS_ORTHO;

    const wallCheck = (t, r, c) => {
      if (extraWallKey && wallKey(t, r, c) === extraWallKey) return true;
      return wallExists(t, r, c);
    };

    const localBlocked = (r1, c1, r2, c2) => {
      const dr = r2 - r1;
      const dc = c2 - c1;
      const hBlocked = (rr, cL) => wallCheck('V', rr, cL) || wallCheck('V', rr - 1, cL);
      const vBlocked = (rT, cc) => wallCheck('H', rT, cc) || wallCheck('H', rT, cc - 1);
      if (dr === 0 && dc !== 0) return hBlocked(r1, Math.min(c1, c2));
      if (dc === 0 && dr !== 0) return vBlocked(Math.min(r1, r2), c1);
      if (dr !== 0 && dc !== 0) {
        const mr = Math.min(r1, r2);
        const mc = Math.min(c1, c2);
        const p1 = (!hBlocked(r1, mc) && !vBlocked(mr, c2));
        const p2 = (!vBlocked(mr, c1) && !hBlocked(r2, mc));
        return !(p1 || p2);
      }
      return false;
    };

    while (queue.length) {
      const [r, c] = queue.shift();
      if (r === targetRow) return true;
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
        if (visited[nr][nc]) continue;
        if (isPlate(nr, nc)) continue;
        if (localBlocked(r, c, nr, nc)) continue;
        visited[nr][nc] = true;
        queue.push([nr, nc]);
      }
    }
    return false;
  }

  function localCheckPaths(extraWallKey) {
    if (!state) return true;
    const allowDiag = gameMode === 'free';
    return (bfsHasPath(state.p1[0], state.p1[1], 0, allowDiag, extraWallKey) &&
            bfsHasPath(state.p2[0], state.p2[1], N - 1, allowDiag, extraWallKey));
  }

  function canPlaceHClient(r, c) {
    if (r < 0 || r > N - 2 || c < 0 || c > N - 2) return false;
    if (wallExists('H', r, c)) return false;
    if (wallExists('H', r, c - 1)) return false;
    if (wallExists('H', r, c + 1)) return false;
    if (wallExists('V', r, c)) return false;
    if (gameMode === 'bombs') return true;
    return localCheckPaths(wallKey('H', r, c));
  }
  function canPlaceVClient(r, c) {
    if (r < 0 || r > N - 2 || c < 0 || c > N - 2) return false;
    if (wallExists('V', r, c)) return false;
    if (wallExists('V', r - 1, c)) return false;
    if (wallExists('V', r + 1, c)) return false;
    if (wallExists('H', r, c)) return false;
    if (gameMode === 'bombs') return true;
    return localCheckPaths(wallKey('V', r, c));
  }

  // ============================================================
  // СТРЕЛКИ
  // ============================================================
  const ARROW_DIR_DELTA = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };
  function arrowAt(r, c) {
    if (!state || !state.arrows) return null;
    return state.arrows.find(a => a.r === r && a.c === c) || null;
  }
  function arrowActive(a) {
    const [dr, dc] = ARROW_DIR_DELTA[a.dir];
    const tr = a.r + dr, tc = a.c + dc;
    if (tr < 0 || tr >= N || tc < 0 || tc >= N) return false;
    if (isBlocked(a.r, a.c, tr, tc)) return false;
    return true;
  }

  function drawArrowOutline(a) {
    const x = PAD + toViewC(a.c) * CELL + CELL / 2;
    const y = PAD + toViewR(a.r) * CELL + CELL / 2;
    const viewDir = toViewDir(a.dir);
    const angle = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[viewDir];
    const active = arrowActive(a);
    ctx.strokeStyle = active ? 'rgba(170, 175, 182, 0.9)' : 'rgba(120, 125, 132, 0.35)';
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const size = CELL * 0.34;
    ctx.lineWidth = Math.max(1.5, CELL * 0.05);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.15, -size * 0.72);
    ctx.lineTo(-size * 0.15, -size * 0.22);
    ctx.lineTo(-size * 0.95, -size * 0.22);
    ctx.lineTo(-size * 0.95, size * 0.22);
    ctx.lineTo(-size * 0.15, size * 0.22);
    ctx.lineTo(-size * 0.15, size * 0.72);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function drawPlate(r, c) {
    const x = PAD + toViewC(c) * CELL;
    const y = PAD + toViewR(r) * CELL;
    const inset = CELL * 0.04;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(x + inset + 2, y + inset + 3, CELL - inset * 2, CELL - inset * 2, CELL * 0.12);
    ctx.fill();
    const grad = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
    grad.addColorStop(0, '#5a5e65');
    grad.addColorStop(0.5, '#4a4d52');
    grad.addColorStop(1, '#3d4045');
    ctx.fillStyle = grad;
    roundRect(x + inset, y + inset, CELL - inset * 2, CELL - inset * 2, CELL * 0.12);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(x + inset + 2, y + inset + 2, CELL - inset * 2 - 4, (CELL - inset * 2) * 0.4, CELL * 0.08);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    roundRect(x + inset, y + inset, CELL - inset * 2, CELL - inset * 2, CELL * 0.12);
    ctx.stroke();
  }

  function drawBubble(b) {
    const cx = PAD + toViewC(b.c) * CELL + CELL / 2;
    const cy = PAD + toViewR(b.r) * CELL + CELL / 2;
    const rad = CELL * 0.34;
    ctx.beginPath();
    ctx.arc(cx, cy + 2, rad * 0.95, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(180, 200, 215, 0.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(220, 235, 245, 0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
    const grad = ctx.createRadialGradient(cx - rad * 0.35, cy - rad * 0.35, rad * 0.05, cx, cy, rad);
    grad.addColorStop(0, 'rgba(255,255,255,0.35)');
    grad.addColorStop(0.7, 'rgba(255,255,255,0.02)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath(); ctx.arc(cx - rad * 0.4, cy - rad * 0.42, rad * 0.14, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
    const len = rad * 1.15;
    const thick = Math.max(3, rad * 0.22);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-Math.PI / 4);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(-len / 2 + 1, -thick / 2 + 1.5, len, thick, thick / 2); ctx.fill();
    ctx.fillStyle = '#e8e5df';
    roundRect(-len / 2, -thick / 2, len, thick, thick / 2); ctx.fill();
    ctx.restore();
  }

  // ============================================================
  // ВЗРЫВ
  // ============================================================
  function drawExplosion(ex) {
    const now = performance.now();
    const t = (now - ex.start) / ex.duration;
    if (t >= 1) return false;
    const cx = ex.cx, cy = ex.cy;
    const ease = 1 - Math.pow(1 - t, 5);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (t < 0.35) {
      const coreT = t / 0.35;
      const coreRad = ex.maxRadius * 0.35 * (1 - coreT);
      if (coreRad > 0.5) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRad);
        g.addColorStop(0, `rgba(255, 255, 255, ${0.95 * (1 - coreT)})`);
        g.addColorStop(1, `rgba(200, 220, 255, 0)`);
        ctx.beginPath(); ctx.arc(cx, cy, coreRad, 0, Math.PI * 2);
        ctx.fillStyle = g; ctx.fill();
      }
    }
    const rad = ease * ex.maxRadius;
    const alpha = Math.pow(1 - t, 1.8);
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(220, 240, 255, ${alpha})`;
    ctx.lineWidth = 1.5 + 3 * Math.max(0, 1 - t * 3);
    ctx.stroke();
    const rad2 = ease * ex.maxRadius * 0.72;
    if (rad2 > 0.5) {
      ctx.beginPath(); ctx.arc(cx, cy, rad2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(160, 200, 255, ${alpha * 0.45})`;
      ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
    return true;
  }

  function drawWallExplosion(we) {
    const now = performance.now();
    const t = (now - we.start) / we.duration;
    if (t >= 1) return false;
    const scale = 1 + t * 0.6;
    const alpha = 1 - t;
    const r = Math.round(255 - t * 30);
    const g = Math.round(220 - t * 160);
    const b = Math.round(120 - t * 100);
    const color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
    ctx.save();
    if (we.type === 'H') {
      const y = PAD + (we.r + 1) * CELL - WALL_THICK / 2;
      const x = PAD + we.c * CELL + CELL * 0.08;
      const w = CELL * 2 - CELL * 0.16;
      const h = WALL_THICK;
      const cx = x + w / 2, cy = y + h / 2;
      const sw = w * scale, sh = h * scale;
      ctx.shadowColor = `rgba(255, 200, 80, ${alpha})`;
      ctx.shadowBlur = 20 * alpha;
      ctx.fillStyle = color;
      roundRect(cx - sw / 2, cy - sh / 2, sw, sh, sh / 2); ctx.fill();
      ctx.shadowBlur = 0;
      if (t < 0.35) {
        const wf = (1 - t / 0.35);
        ctx.fillStyle = `rgba(255, 255, 220, ${wf * 0.85})`;
        roundRect(cx - sw / 2, cy - sh / 2, sw, sh, sh / 2); ctx.fill();
      }
    } else {
      const x = PAD + (we.c + 1) * CELL - WALL_THICK / 2;
      const y = PAD + we.r * CELL + CELL * 0.08;
      const w = WALL_THICK;
      const h = CELL * 2 - CELL * 0.16;
      const cx = x + w / 2, cy = y + h / 2;
      const sw = w * scale, sh = h * scale;
      ctx.shadowColor = `rgba(255, 200, 80, ${alpha})`;
      ctx.shadowBlur = 20 * alpha;
      ctx.fillStyle = color;
      roundRect(cx - sw / 2, cy - sh / 2, sw, sh, sw / 2); ctx.fill();
      ctx.shadowBlur = 0;
      if (t < 0.35) {
        const wf = (1 - t / 0.35);
        ctx.fillStyle = `rgba(255, 255, 220, ${wf * 0.85})`;
        roundRect(cx - sw / 2, cy - sh / 2, sw, sh, sw / 2); ctx.fill();
      }
    }
    ctx.restore();
    return true;
  }

  // ============================================================
  // ОТРИСОВКА
  // ============================================================
  function draw() {
    if (!state) return;
    const size = canvas.width / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, size, size);
    const v = getViewAsPlayer();
    function vR(r) { return v === 1 ? r : N - 1 - r; }
    function vC(c) { return v === 1 ? c : N - 1 - c; }

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = PAD + vC(c) * CELL, y = PAD + vR(r) * CELL;
        ctx.fillStyle = (r + c) % 2 === 0 ? '#34373c' : '#2e3136';
        ctx.fillRect(x, y, CELL, CELL);
      }
    }

    if (gameMode === 'plates' && state.plates) {
      for (const [pr, pc] of state.plates) drawPlate(pr, pc);
    }
    if (gameMode === 'arrows' && state.arrows) {
      for (const a of state.arrows) drawArrowOutline(a);
    }
    if (gameMode === 'infinite_walls' && state.bubbles) {
      for (const b of state.bubbles) drawBubble(b);
    }

    if (!isObserver && !state.gameOver && state.current === myPlayer && !dragState && !sending && !eventPlaying) {
      const moves = getAvailableMoves(myPlayer);
      for (const [mr, mc] of moves) {
        if (gameMode === 'arrows' && arrowAt(mr, mc)) continue;
        const x = PAD + vC(mc) * CELL + CELL / 2, y = PAD + vR(mr) * CELL + CELL / 2;
        ctx.beginPath(); ctx.arc(x, y, CELL * 0.14, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fill();
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      const p = PAD + i * CELL;
      ctx.beginPath(); ctx.moveTo(PAD, p); ctx.lineTo(PAD + N * CELL, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, PAD); ctx.lineTo(p, PAD + N * CELL); ctx.stroke();
    }

    for (const k of state.walls) {
      const w = parseWallKey(k);
      const owner = getWallOwner(k);
      const col = owner === 1 ? COLOR_P1 : (owner === 2 ? COLOR_P2 : '#79705f');
      drawWall(w.type, w.r, w.c, col, v);
    }

    if (!isObserver && dragState) drawPreviewWallAnim(v);

    for (let i = explosions.length - 1; i >= 0; i--) {
      if (!drawExplosion(explosions[i])) explosions.splice(i, 1);
    }
    for (let i = wallExplosions.length - 1; i >= 0; i--) {
      if (!drawWallExplosion(wallExplosions[i])) wallExplosions.splice(i, 1);
    }

    const pos1 = getPiecePos('p1');
    const pos2 = getPiecePos('p2');
    drawPiece(pos1.r, pos1.c, COLOR_P1, v);
    drawPiece(pos2.r, pos2.c, COLOR_P2, v);

    if (!isObserver && !state.gameOver && state.current === myPlayer && !eventPlaying) {
      const pos = myPlayer === 1 ? pos1 : pos2;
      const x = PAD + vC(pos.c) * CELL + CELL / 2;
      const y = PAD + vR(pos.r) * CELL + CELL / 2;
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.44, 0, Math.PI * 2);
      ctx.strokeStyle = myPlayer === 1 ? COLOR_P1 : COLOR_P2;
      ctx.lineWidth = 2; ctx.stroke();
    }
  }

  function drawPreviewWallAnim(viewAsPlayer) {
    if (!dragState) return;
    const { animX, animY, preview, orient } = dragState;
    const pColor = myPlayer === 1 ? COLOR_P1 : COLOR_P2;
    ctx.save();
    ctx.globalAlpha = preview ? 0.22 : 0.38;
    ctx.fillStyle = pColor;
    ctx.translate(animX, animY);
    if (orient === 'h') roundRect(-CELL + CELL * 0.08, -WALL_THICK / 2, CELL * 2 - CELL * 0.16, WALL_THICK, WALL_THICK / 2);
    else roundRect(-WALL_THICK / 2, -CELL + CELL * 0.08, WALL_THICK, CELL * 2 - CELL * 0.16, WALL_THICK / 2);
    ctx.fill();
    ctx.restore();
    if (preview) {
      const vr = preview.viewR, vc = preview.viewC;
      const cx = PAD + (vc + 1) * CELL, cy = PAD + (vr + 1) * CELL;
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = pColor;
      ctx.translate(cx, cy);
      if (orient === 'h') roundRect(-CELL + CELL * 0.08, -WALL_THICK / 2, CELL * 2 - CELL * 0.16, WALL_THICK, WALL_THICK / 2);
      else roundRect(-WALL_THICK / 2, -CELL + CELL * 0.08, WALL_THICK, CELL * 2 - CELL * 0.16, WALL_THICK / 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawWall(t, r, c, color, v) {
    let vr, vc;
    if (v === 1) { vr = r; vc = c; }
    else { vr = N - 2 - r; vc = N - 2 - c; }
    if (t.toUpperCase() === 'H') drawWallH(vr, vc, color);
    else drawWallV(vr, vc, color);
  }
  function drawWallH(r, c, color) {
    const y = PAD + (r + 1) * CELL - WALL_THICK / 2;
    const x = PAD + c * CELL + CELL * 0.08;
    const w = CELL * 2 - CELL * 0.16;
    ctx.fillStyle = color;
    roundRect(x, y, w, WALL_THICK, WALL_THICK / 2); ctx.fill();
  }
  function drawWallV(r, c, color) {
    const x = PAD + (c + 1) * CELL - WALL_THICK / 2;
    const y = PAD + r * CELL + CELL * 0.08;
    const h = CELL * 2 - CELL * 0.16;
    ctx.fillStyle = color;
    roundRect(x, y, WALL_THICK, h, WALL_THICK / 2); ctx.fill();
  }
  function drawPiece(row, col, color, v) {
    const vr = v === 1 ? row : N - 1 - row;
    const vc = v === 1 ? col : N - 1 - col;
    const x = PAD + vc * CELL + CELL / 2;
    const y = PAD + vr * CELL + CELL / 2;
    const rad = CELL * 0.32;
    ctx.beginPath(); ctx.arc(x, y + 2, rad, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.arc(x - rad * 0.28, y - rad * 0.28, rad * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill();
  }
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ============================================================
  // DOM
  // ============================================================
  function buildDots(container, count) {
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      container.appendChild(d);
    }
  }
  function setAvatarDOM(el, playerNum, meta) {
    if (!el) return;
    el.classList.remove('me-1', 'me-2', 'active');
    if (playerNum) el.classList.add('me-' + playerNum);
    if (meta && meta.photo) el.innerHTML = `<img src="${meta.photo}" alt="" referrerpolicy="no-referrer">`;
    else if (meta && meta.name) el.textContent = meta.name.charAt(0).toUpperCase();
    else el.textContent = playerNum || '?';
  }

  function updateObserversBadge() {
    const n = observersList.length;
    if (n === 0) { obsBadge.classList.remove('visible'); return; }
    obsBadge.classList.add('visible');
    if (n <= 3) {
      obsStack.style.display = 'flex';
      obsCount.style.display = 'none';
      obsStack.innerHTML = '';
      observersList.forEach(o => {
        const a = document.createElement('div');
        a.className = 'obs-ava';
        if (o.photo) a.innerHTML = `<img src="${o.photo}" alt="" referrerpolicy="no-referrer">`;
        else a.textContent = (o.name || '?').charAt(0).toUpperCase();
        obsStack.appendChild(a);
      });
    } else {
      obsStack.style.display = 'none';
      obsCount.style.display = 'block';
      obsCount.textContent = String(n);
      obsStack.innerHTML = '';
    }
  }

  function rebuildWallOwners() {
    const map = new Map();
    if (!state) return map;
    for (const k of state.walls) {
      const w = parseWallKey(k);
      if (w.player === 1 || w.player === 2) map.set(`${w.type}:${w.r}:${w.c}`, w.player);
    }
    const history = state.history || [];
    for (const move of history) {
      if (move && move.type === 'wall') {
        const key = `${(move.orient || 'h').toUpperCase()}:${move.r}:${move.c}`;
        if (!map.has(key)) map.set(key, move.player);
      }
    }
    return map;
  }
  function getWallOwner(k) {
    const w = parseWallKey(k);
    if (w.player === 1 || w.player === 2) return w.player;
    return wallOwnerMap.get(`${w.type}:${w.r}:${w.c}`) || 0;
  }

  // ============================================================
  // ХОДЫ
  // ============================================================
  function getAvailableMoves(player) {
    if (!state || state.gameOver) return [];
    const from = player === 1 ? state.p1 : state.p2;
    const enemy = player === 1 ? state.p2 : state.p1;
    const dirs = DIRS_ORTHO.slice();
    if (gameMode === 'free') dirs.push(...DIRS_DIAG);
    const moves = [];
    for (const [dr, dc] of dirs) {
      const mr = from[0] + dr, mc = from[1] + dc;
      if (mr < 0 || mr >= N || mc < 0 || mc >= N) continue;
      if (isBlocked(from[0], from[1], mr, mc)) continue;
      if (gameMode === 'plates' && isPlate(mr, mc)) continue;
      if (mr === enemy[0] && mc === enemy[1]) {
        const jr = mr + dr, jc = mc + dc;
        const jw = isBlocked(mr, mc, jr, jc);
        const jo = jr < 0 || jr >= N || jc < 0 || jc >= N;
        const jPlate = !jo && gameMode === 'plates' && isPlate(jr, jc);
        if (!jw && !jo && !jPlate) moves.push([jr, jc]);
        else {
          const sides = dr === 0 ? [[-1,0],[1,0]] : (dc === 0 ? [[0,-1],[0,1]] : []);
          for (const [sr, sc] of sides) {
            const dr2 = mr + sr, dc2 = mc + sc;
            if (dr2 < 0 || dr2 >= N || dc2 < 0 || dc2 >= N) continue;
            if (isBlocked(mr, mc, dr2, dc2)) continue;
            if (isBlocked(from[0], from[1], dr2, dc2)) continue;
            if (gameMode === 'plates' && isPlate(dr2, dc2)) continue;
            moves.push([dr2, dc2]);
          }
        }
        continue;
      }
      moves.push([mr, mc]);
    }
    const seen = new Set();
    return moves.filter(([r, c]) => { const k = r + ',' + c; if (seen.has(k)) return false; seen.add(k); return true; });
  }

  // ============================================================
  // АНИМАЦИИ
  // ============================================================
  function tickAnimations() {
    animRaf = requestAnimationFrame(() => {
      const now = performance.now();
      let active = false;

      for (const who of ['p1', 'p2']) {
        const a = pieceAnim[who];
        if (!a) continue;
        if (now - a.start >= a.duration) {
          pieceAnim[who] = null;
          if (a.onDone) a.onDone();
        } else active = true;
      }
      if (teleportAnim) {
        if (now - teleportAnim.start >= teleportAnim.duration) {
          const cb = teleportAnim.onDone;
          teleportAnim = null;
          if (cb) cb();
        } else active = true;
      }
      if (explosions.length || wallExplosions.length) active = true;
      if (eventQueue.length || eventPlaying) active = true;

      draw();
      if (active) tickAnimations();
      else { animRaf = null; draw(); }
    });
  }

  function getPiecePos(who) {
    const playerNum = who === 'p1' ? 1 : 2;

    if (teleportAnim && teleportAnim.player === playerNum) {
      const now = performance.now();
      const t = Math.min(1, (now - teleportAnim.start) / teleportAnim.duration);
      const e = easeInOutQuad(t);
      return {
        r: teleportAnim.fromR + (teleportAnim.toR - teleportAnim.fromR) * e,
        c: teleportAnim.fromC + (teleportAnim.toC - teleportAnim.fromC) * e,
      };
    }

    const a = pieceAnim[who];
    if (a) {
      const now = performance.now();
      const t = Math.min(1, (now - a.start) / a.duration);
      const e = easeOutQuad(t);
      return {
        r: a.fromR + (a.toR - a.fromR) * e,
        c: a.fromC + (a.toC - a.fromC) * e,
      };
    }

    const visual = who === 'p1' ? visualP1 : visualP2;
    return { r: visual[0], c: visual[1] };
  }

  function startPieceAnim(who, fromR, fromC, toR, toC, onDone) {
    pieceAnim[who] = { fromR, fromC, toR, toC, start: performance.now(), duration: MOVE_DURATION, onDone };
    if (!animRaf) tickAnimations();
  }

  function startTeleportAnim(player, fromR, fromC, toR, toC, onDone) {
    teleportAnim = {
      player,
      fromR, fromC, toR, toC,
      start: performance.now(),
      duration: TELEPORT_DURATION,
      onDone,
    };
    if (!animRaf) tickAnimations();
  }

  // ============================================================
  // ПРОИГРЫВАНИЕ СОБЫТИЙ
  // ============================================================
  function playTurnEvents(events) {
    eventQueue.push(...events);
    if (!eventPlaying) playNextEvent();
  }

  function playNextEvent() {
    if (!eventQueue.length) {
      eventPlaying = false;
      if (state) {
        visualP1 = [...state.p1];
        visualP2 = [...state.p2];
      }
      refresh();
      return;
    }
    eventPlaying = true;
    const ev = eventQueue.shift();

    if (ev.type === 'move') {
      const who = ev.player === 1 ? 'p1' : 'p2';
      if (who === 'p1') visualP1 = [...ev.from];
      else visualP2 = [...ev.from];
      startPieceAnim(who, ev.from[0], ev.from[1], ev.to[0], ev.to[1], () => {
        if (who === 'p1') visualP1 = [...ev.to];
        else visualP2 = [...ev.to];
        setTimeout(playNextEvent, EVENT_GAP);
      });
    } else if (ev.type === 'teleport') {
      const cur = ev.player === 1 ? [...visualP1] : [...visualP2];
      startTeleportAnim(ev.player, cur[0], cur[1], ev.to[0], ev.to[1], () => {
        if (ev.player === 1) visualP1 = [...ev.to];
        else visualP2 = [...ev.to];
        setTimeout(playNextEvent, EVENT_GAP);
      });
    } else if (ev.type === 'bomb') {
      const cx = PAD + ev.c * CELL + CELL / 2;
      const cy = PAD + ev.r * CELL + CELL / 2;
      explosions.push({
        cx, cy,
        start: performance.now(),
        duration: 700,
        maxRadius: CELL * 1.05
      });
      if (ev.destroyed) {
        ev.destroyed.forEach((dk, j) => {
          const [t, r, c] = dk.split(':');
          wallExplosions.push({
            type: t,
            r: parseInt(r),
            c: parseInt(c),
            start: performance.now() + j * 30,
            duration: 380
          });
        });
      }
      if (!animRaf) tickAnimations();
      setTimeout(playNextEvent, 700);
    } else if (ev.type === 'wall') {
      setTimeout(playNextEvent, 120);
    } else if (ev.type === 'bubble_collect') {
      setTimeout(playNextEvent, 120);
    } else if (ev.type === 'bubble_spawn') {
      setTimeout(playNextEvent, 120);
    } else {
      setTimeout(playNextEvent, 60);
    }
  }

  // ============================================================
  // REFRESH
  // ============================================================
  function refresh() {
    draw();
    if (!state) return;

    let topPlayer, bottomPlayer;
    if (isObserver) { topPlayer = 2; bottomPlayer = 1; }
    else { topPlayer = myPlayer === 1 ? 2 : 1; bottomPlayer = myPlayer; }

    const topMeta = playersMeta[topPlayer] || {};
    setAvatarDOM(enemyAvatar, topPlayer, topMeta);
    enemyName.textContent = topMeta.name || ('Игрок ' + topPlayer);
    enemyPanel.classList.remove('active-1', 'active-2');

    const topLeft = topPlayer === 1 ? state.left1 : state.left2;
    const topDots = enemyDotsEl.children;
    for (let i = 0; i < topDots.length; i++) topDots[i].className = 'dot' + (i < topLeft ? ' me-' + topPlayer : '');
    const topActive = !state.gameOver && state.current === topPlayer;
    enemyPanel.classList.toggle('active-' + topPlayer, topActive);
    enemyTurn.classList.toggle('show', topActive);
    enemyAvatar.classList.toggle('active', topActive);

    if (gameMode === 'bombs') {
      const enemyBombCount = topPlayer === 1 ? state.bombs1 : state.bombs2;
      const enemyBombDots = enemyBombsEl.children;
      for (let i = 0; i < enemyBombDots.length; i++) {
        enemyBombDots[i].className = 'dot ' + (i < enemyBombCount ? 'bomb' : 'bomb empty');
      }
    }

    const botMeta = playersMeta[bottomPlayer] || {};
    setAvatarDOM(myAvatar, bottomPlayer, botMeta);
    myName.textContent = botMeta.name || ('Игрок ' + bottomPlayer);
    myPanel.classList.remove('active-1', 'active-2');
    myDrags.querySelectorAll('.drag-item').forEach(item => { item.classList.remove('me-1', 'me-2'); item.classList.add('me-' + bottomPlayer); });

    const botLeft = bottomPlayer === 1 ? state.left1 : state.left2;
    const botDots = myDotsEl.children;
    for (let i = 0; i < botDots.length; i++) botDots[i].className = 'dot' + (i < botLeft ? ' me-' + bottomPlayer : '');
    const botActive = !state.gameOver && state.current === bottomPlayer;
    myPanel.classList.toggle('active-' + bottomPlayer, botActive);
    myTurn.classList.toggle('show', botActive);
    myAvatar.classList.toggle('active', botActive);

    if (gameMode === 'bombs') {
      const myBombCount = bottomPlayer === 1 ? state.bombs1 : state.bombs2;
      const myBombDots = myBombsEl.children;
      for (let i = 0; i < myBombDots.length; i++) {
        myBombDots[i].className = 'dot ' + (i < myBombCount ? 'bomb' : 'bomb empty');
      }
      bombCnt.textContent = myBombCount;
      btnBomb.disabled = myBombCount <= 0 || state.gameOver || state.current !== myPlayer || sending;
      btnBomb.classList.toggle('hidden', isObserver);
    }

    if (isObserver) {
      myDrags.style.display = 'none';
      btnSurrender.classList.add('hidden');
      btnBomb.classList.add('hidden');
    } else {
      myDrags.style.display = '';

      const myTurnActive = !state.gameOver && state.current === myPlayer;
      myDrags.querySelectorAll('.drag-item').forEach(item => {
        item.classList.toggle('disabled', !myTurnActive || botLeft <= 0 || sending);
      });

      if (state.started && !state.gameOver) {
        btnSurrender.classList.remove('hidden');
      } else {
        btnSurrender.classList.add('hidden');
      }
      if (gameMode === 'bombs') btnBomb.classList.remove('hidden');
    }

    updateObserversBadge();
  }

  function applyState(s) {
    const prev = state;
    state = s;
    if (s.players) playersMeta = s.players;
    if (s.observers) observersList = s.observers;
    wallOwnerMap = rebuildWallOwners();

    if (!prev) {
      visualP1 = [...s.p1];
      visualP2 = [...s.p2];
    }

    const newTurnIndex = s.turnIndex || 0;
    const events = s.lastTurnEvents || [];
    if (newTurnIndex > lastAnimatedTurnIndex && events.length) {
      lastAnimatedTurnIndex = newTurnIndex;
      playTurnEvents(events);
    } else if (newTurnIndex > lastAnimatedTurnIndex) {
      lastAnimatedTurnIndex = newTurnIndex;
      if (!eventPlaying && eventQueue.length === 0) {
        visualP1 = [...s.p1];
        visualP2 = [...s.p2];
      }
    }
  }

  function handleGameOver(winner, replayId) {
    if (lastGameOverShown) return;
    lastGameOverShown = true;
    stopPolling();
    showWinScreen(winner, replayId);
  }

  async function fetchState() {
    if (!roomCode) return;
    if (lastGameOverShown) return;
    try {
      const s = await api(`/api/state/${roomCode}`);
      applyState(s);
      refresh();
      if (s.started && screens.waiting.classList.contains('active')) {
        resizeCanvas(); refresh(); showScreen('game');
      }
      if (s.gameOver && s.winner) handleGameOver(s.winner, s.replayId);
    } catch (e) {
      if (lastGameOverShown) return;
      if (e.status === 404) {
        stopPolling();
        showError('Комната недоступна', 'Возможно, игра уже завершена.');
        return;
      }
      stopPolling();
      showDialog({
        title: 'Соединение потеряно',
        text: 'Возможно, комната закрыта.',
        buttons: [{ label: 'ОК', primary: true, onClick: () => { if (tg) { try { tg.close(); } catch (err) {} } } }]
      });
    }
  }
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(fetchState, POLL_INTERVAL);
    fetchState();
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function showWinScreen(winner, replayId) {
    const loser = winner === 1 ? 2 : 1;
    const wmeta = playersMeta[winner] || {};
    const lmeta = playersMeta[loser] || {};

    if (wmeta.photo) winnerAvatarEl.innerHTML = `<img src="${wmeta.photo}" alt="" referrerpolicy="no-referrer">`;
    else winnerAvatarEl.textContent = (wmeta.name || 'И').charAt(0).toUpperCase();
    winnerAvatarEl.classList.toggle('is-p2', winner === 2);

    if (lmeta.photo) loserAvatarEl.innerHTML = `<img src="${lmeta.photo}" alt="" referrerpolicy="no-referrer">`;
    else loserAvatarEl.textContent = (lmeta.name || 'П').charAt(0).toUpperCase();

    winnerNameEl.textContent = wmeta.name || ('Игрок ' + winner);
    loserNameEl.textContent = lmeta.name || ('Игрок ' + loser);

    winScreen.classList.add('show');

    btnWinClose.onclick = () => {
      winScreen.classList.remove('show');
      if (tg) { try { tg.close(); } catch (e) {} }
    };
    btnWinShare.onclick = () => {
      if (replayId && tg && tg.switchInlineQuery) {
        try { tg.switchInlineQuery('replay_' + replayId, ['users', 'groups', 'channels']); }
        catch (e) {}
      }
    };
  }

  btnSurrender.addEventListener('click', () => {
    if (!state || state.gameOver) return;
    showDialog({
      title: 'Сдаться?',
      text: 'Соперник сразу победит. Партия сохранится в повтор.',
      buttons: [
        { label: 'Отмена' },
        { label: 'Сдаться', danger: true, onClick: doSurrender }
      ]
    });
  });

  async function doSurrender() {
    if (!roomCode || !myPlayer) return;
    try {
      const res = await api(`/api/surrender/${roomCode}`, {
        method: 'POST',
        body: JSON.stringify({ player: myPlayer }),
      });
      if (res && res.gameOver && res.winner) {
        applyState({ ...state, ...res });
        handleGameOver(res.winner, res.replayId);
      }
    } catch (e) {
      if (e.status === 404) {
        stopPolling();
        showError('Комната недоступна', 'Игра уже завершена.');
      }
    }
  }

  btnBomb.addEventListener('click', () => {
    if (isObserver) return;
    if (!state || state.gameOver) return;
    if (state.current !== myPlayer) return;
    sendMove({ type: 'bomb' });
  });

  obsBadge.addEventListener('click', () => showObserversPopup());

  // ============================================================
  // ПОВТОР
  // ============================================================
  let replayData = null;
  let replayP1 = [0, 0], replayP2 = [0, 0], replayWalls = [];
  let replayPlates = [];
  let replayArrows = [];
  let replayBubbles = [];
  let replayMode = 'classic';
  let replayStep = 0;
  let replayPieceAnim = { p1: null, p2: null };
  let replayAnimRaf = null;
  let replayWallOwnerMap = new Map();
  let replayExplosions = [];
  let replayWallExplosions = [];

  const replayCanvas = document.getElementById('replayBoard');
  const replayCtx = replayCanvas.getContext('2d');
  const movesListEl = document.getElementById('movesList');
  const btnReplayPrev = document.getElementById('btnReplayPrev');
  const btnReplayNext = document.getElementById('replayNext');
  const btnReplayShare = document.getElementById('btnReplayShare');
  const replayCounterCurrent = document.getElementById('replayCounterCurrent');
  const replayCounterTotal = document.getElementById('replayCounterTotal');
  const replayProgress = document.getElementById('replayProgress');
  const replayModeTag = document.getElementById('replayModeTag');

  const replayAvatarP1 = document.getElementById('replayAvatarP1');
  const replayAvatarP2 = document.getElementById('replayAvatarP2');
  const replayNameP1 = document.getElementById('replayNameP1');
  const replayNameP2 = document.getElementById('replayNameP2');

  let R_CELL = 0, R_PAD = 0, R_WALL_THICK = 0;
  function resizeReplayCanvas() {
    const area = replayCanvas.closest('.board-area');
    const rect = area.getBoundingClientRect();
    const size = Math.min(rect.width, rect.height);
    const dpr = window.devicePixelRatio || 1;
    replayCanvas.width = Math.floor(size * dpr);
    replayCanvas.height = Math.floor(size * dpr);
    replayCanvas.style.width = size + 'px';
    replayCanvas.style.height = size + 'px';
    replayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R_PAD = size * 0.04;
    R_CELL = (size - R_PAD * 2) / N;
    R_WALL_THICK = Math.max(4, R_CELL * 0.14);
  }

  function replayStartAnim(who, fromR, fromC, toR, toC) {
    if (fromR === toR && fromC === toC) return;
    replayPieceAnim[who] = { fromR, fromC, toR, toC, start: performance.now(), duration: MOVE_DURATION };
    if (!replayAnimRaf) replayTick();
  }
  function replayTick() {
    replayAnimRaf = requestAnimationFrame(() => {
      const now = performance.now();
      let active = false;
      for (const who of ['p1', 'p2']) {
        const a = replayPieceAnim[who];
        if (!a) continue;
        if (now - a.start >= a.duration) replayPieceAnim[who] = null;
        else active = true;
      }
      for (let i = replayExplosions.length - 1; i >= 0; i--) {
        if (now - replayExplosions[i].start >= replayExplosions[i].duration) replayExplosions.splice(i, 1);
      }
      for (let i = replayWallExplosions.length - 1; i >= 0; i--) {
        if (now - replayWallExplosions[i].start >= replayWallExplosions[i].duration) replayWallExplosions.splice(i, 1);
      }
      if (replayExplosions.length || replayWallExplosions.length) active = true;

      replayDraw();
      if (active) replayTick();
      else { replayAnimRaf = null; replayDraw(); }
    });
  }
  function replayGetPos(who, pos) {
    const a = replayPieceAnim[who];
    if (!a) return { r: pos[0], c: pos[1] };
    const t = Math.min(1, (performance.now() - a.start) / a.duration);
    const e = easeOutQuad(t);
    return { r: a.fromR + (a.toR - a.fromR) * e, c: a.fromC + (a.toC - a.fromC) * e };
  }

  function moveNotation(mv) {
    if (!mv) return '?';
    if (mv.type === 'move') {
      if (mv.from && mv.to) return chess(mv.from[0], mv.from[1]) + '→' + chess(mv.to[0], mv.to[1]);
    }
    if (mv.type === 'wall') {
      const tag = (mv.orient || '?').toUpperCase();
      const toR = mv.r + (mv.orient === 'v' ? 1 : 0);
      const toC = mv.c + (mv.orient === 'h' ? 1 : 0);
      return tag + ' ' + chess(mv.r, mv.c) + '→' + chess(toR, toC);
    }
    if (mv.type === 'teleport') return '↷ ' + chess(mv.from[0], mv.from[1]) + '→' + chess(mv.to[0], mv.to[1]);
    if (mv.type === 'bomb') return '💣 ' + chess(mv.r, mv.c);
    if (mv.type === 'bubble_collect') return '🫧 ' + chess(mv.r, mv.c);
    if (mv.type === 'bubble_spawn') return '🫧+ ' + chess(mv.r, mv.c);
    return '?';
  }

  function replayDraw() {
    if (!replayData) return;
    const size = replayCanvas.width / (window.devicePixelRatio || 1);
    replayCtx.clearRect(0, 0, size, size);

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = R_PAD + c * R_CELL, y = R_PAD + r * R_CELL;
        replayCtx.fillStyle = (r + c) % 2 === 0 ? '#34373c' : '#2e3136';
        replayCtx.fillRect(x, y, R_CELL, R_CELL);
      }
    }

    if (replayMode === 'plates' && replayPlates.length) {
      for (const [pr, pc] of replayPlates) {
        const x = R_PAD + pc * R_CELL, y = R_PAD + pr * R_CELL;
        const inset = R_CELL * 0.04;
        replayCtx.fillStyle = 'rgba(0,0,0,0.35)';
        replayRoundRect(x + inset + 2, y + inset + 3, R_CELL - inset * 2, R_CELL - inset * 2, R_CELL * 0.12);
        replayCtx.fill();
        const grad = replayCtx.createLinearGradient(x, y, x + R_CELL, y + R_CELL);
        grad.addColorStop(0, '#5a5e65');
        grad.addColorStop(0.5, '#4a4d52');
        grad.addColorStop(1, '#3d4045');
        replayCtx.fillStyle = grad;
        replayRoundRect(x + inset, y + inset, R_CELL - inset * 2, R_CELL - inset * 2, R_CELL * 0.12);
        replayCtx.fill();
        replayCtx.strokeStyle = 'rgba(255,255,255,0.10)';
        replayCtx.lineWidth = 1;
        replayRoundRect(x + inset, y + inset, R_CELL - inset * 2, R_CELL - inset * 2, R_CELL * 0.12);
        replayCtx.stroke();
      }
    }

    if (replayMode === 'arrows' && replayArrows.length) {
      for (const a of replayArrows) {
        const x = R_PAD + a.c * R_CELL + R_CELL / 2;
        const y = R_PAD + a.r * R_CELL + R_CELL / 2;
        const angle = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[a.dir];
        const dr = ARROW_DIR_DELTA[a.dir][0], dc = ARROW_DIR_DELTA[a.dir][1];
        const tr = a.r + dr, tc = a.c + dc;
        let active = (tr >= 0 && tr < N && tc >= 0 && tc < N);
        if (active) {
          const drr = tr - a.r, dcc = tc - a.c;
          let blocked = false;
          if (drr === 0 && dcc !== 0) {
            const mc = Math.min(a.c, tc);
            blocked = replayWalls.includes(`V:${a.r}:${mc}`) || replayWalls.includes(`V:${a.r - 1}:${mc}`);
          } else if (dcc === 0 && drr !== 0) {
            const mr = Math.min(a.r, tr);
            blocked = replayWalls.includes(`H:${mr}:${a.c}`) || replayWalls.includes(`H:${mr}:${a.c - 1}`);
          }
          if (blocked) active = false;
        }
        replayCtx.strokeStyle = active ? 'rgba(170, 175, 182, 0.9)' : 'rgba(120, 125, 132, 0.35)';
        replayCtx.save();
        replayCtx.translate(x, y);
        replayCtx.rotate(angle);
        const sz = R_CELL * 0.34;
        replayCtx.lineWidth = Math.max(1.5, R_CELL * 0.05);
        replayCtx.lineJoin = 'round';
        replayCtx.lineCap = 'round';
        replayCtx.beginPath();
        replayCtx.moveTo(sz, 0);
        replayCtx.lineTo(-sz * 0.15, -sz * 0.72);
        replayCtx.lineTo(-sz * 0.15, -sz * 0.22);
        replayCtx.lineTo(-sz * 0.95, -sz * 0.22);
        replayCtx.lineTo(-sz * 0.95, sz * 0.22);
        replayCtx.lineTo(-sz * 0.15, sz * 0.22);
        replayCtx.lineTo(-sz * 0.15, sz * 0.72);
        replayCtx.closePath();
        replayCtx.stroke();
        replayCtx.restore();
      }
    }

    if (replayMode === 'infinite_walls' && replayBubbles.length) {
      for (const b of replayBubbles) {
        const cx = R_PAD + b.c * R_CELL + R_CELL / 2;
        const cy = R_PAD + b.r * R_CELL + R_CELL / 2;
        const rad = R_CELL * 0.34;
        replayCtx.beginPath();
        replayCtx.arc(cx, cy + 2, rad * 0.95, 0, Math.PI * 2);
        replayCtx.fillStyle = 'rgba(0,0,0,0.22)'; replayCtx.fill();
        replayCtx.beginPath(); replayCtx.arc(cx, cy, rad, 0, Math.PI * 2);
        replayCtx.fillStyle = 'rgba(180, 200, 215, 0.35)'; replayCtx.fill();
        replayCtx.beginPath(); replayCtx.arc(cx, cy, rad, 0, Math.PI * 2);
        replayCtx.strokeStyle = 'rgba(220, 235, 245, 0.55)'; replayCtx.lineWidth = 1.5; replayCtx.stroke();
        const grad = replayCtx.createRadialGradient(cx - rad * 0.35, cy - rad * 0.35, rad * 0.05, cx, cy, rad);
        grad.addColorStop(0, 'rgba(255,255,255,0.35)');
        grad.addColorStop(0.7, 'rgba(255,255,255,0.02)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        replayCtx.beginPath(); replayCtx.arc(cx, cy, rad, 0, Math.PI * 2);
        replayCtx.fillStyle = grad; replayCtx.fill();
        replayCtx.beginPath(); replayCtx.arc(cx - rad * 0.4, cy - rad * 0.42, rad * 0.14, 0, Math.PI * 2);
        replayCtx.fillStyle = 'rgba(255,255,255,0.6)'; replayCtx.fill();
        const len = rad * 1.15;
        const thick = Math.max(3, rad * 0.22);
        replayCtx.save();
        replayCtx.translate(cx, cy);
        replayCtx.rotate(-Math.PI / 4);
        replayCtx.fillStyle = 'rgba(0,0,0,0.18)';
        replayRoundRect(-len / 2 + 1, -thick / 2 + 1.5, len, thick, thick / 2); replayCtx.fill();
        replayCtx.fillStyle = '#e8e5df';
        replayRoundRect(-len / 2, -thick / 2, len, thick, thick / 2); replayCtx.fill();
        replayCtx.restore();
      }
    }

    replayCtx.strokeStyle = 'rgba(255,255,255,0.035)';
    replayCtx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      const p = R_PAD + i * R_CELL;
      replayCtx.beginPath(); replayCtx.moveTo(R_PAD, p); replayCtx.lineTo(R_PAD + N * R_CELL, p); replayCtx.stroke();
      replayCtx.beginPath(); replayCtx.moveTo(p, R_PAD); replayCtx.lineTo(p, R_PAD + N * R_CELL); replayCtx.stroke();
    }

    for (const k of replayWalls) {
      const [t, r, c] = k.split(':');
      const owner = replayWallOwnerMap.get(`${t}:${r}:${c}`) || 0;
      const col = owner === 1 ? COLOR_P1 : (owner === 2 ? COLOR_P2 : '#79705f');
      if (t === 'H') replayWallH(parseInt(r), parseInt(c), col);
      else replayWallV(parseInt(r), parseInt(c), col);
    }

    for (let i = replayExplosions.length - 1; i >= 0; i--) {
      if (!replayDrawExplosion(replayExplosions[i])) replayExplosions.splice(i, 1);
    }
    for (let i = replayWallExplosions.length - 1; i >= 0; i--) {
      if (!replayDrawWallExplosion(replayWallExplosions[i])) replayWallExplosions.splice(i, 1);
    }

    const pos1 = replayGetPos('p1', replayP1);
    const pos2 = replayGetPos('p2', replayP2);
    replayDrawPiece(pos1.r, pos1.c, COLOR_P1);
    replayDrawPiece(pos2.r, pos2.c, COLOR_P2);
  }

  function replayWallH(r, c, color) {
    const y = R_PAD + (r + 1) * R_CELL - R_WALL_THICK / 2;
    const x = R_PAD + c * R_CELL + R_CELL * 0.08;
    const w = R_CELL * 2 - R_CELL * 0.16;
    replayCtx.fillStyle = color;
    replayRoundRect(x, y, w, R_WALL_THICK, R_WALL_THICK / 2); replayCtx.fill();
  }
  function replayWallV(r, c, color) {
    const x = R_PAD + (c + 1) * R_CELL - R_WALL_THICK / 2;
    const y = R_PAD + r * R_CELL + R_CELL * 0.08;
    const h = R_CELL * 2 - R_CELL * 0.16;
    replayCtx.fillStyle = color;
    replayRoundRect(x, y, R_WALL_THICK, h, R_WALL_THICK / 2); replayCtx.fill();
  }
  function replayDrawPiece(row, col, color) {
    const x = R_PAD + col * R_CELL + R_CELL / 2;
    const y = R_PAD + row * R_CELL + R_CELL / 2;
    const rad = R_CELL * 0.32;
    replayCtx.beginPath(); replayCtx.arc(x, y + 2, rad, 0, Math.PI * 2); replayCtx.fillStyle = 'rgba(0,0,0,0.35)'; replayCtx.fill();
    replayCtx.beginPath(); replayCtx.arc(x, y, rad, 0, Math.PI * 2); replayCtx.fillStyle = color; replayCtx.fill();
    replayCtx.beginPath(); replayCtx.arc(x - rad * 0.28, y - rad * 0.28, rad * 0.3, 0, Math.PI * 2); replayCtx.fillStyle = 'rgba(255,255,255,0.18)'; replayCtx.fill();
  }
  function replayRoundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    replayCtx.beginPath();
    replayCtx.moveTo(x + r, y);
    replayCtx.lineTo(x + w - r, y);
    replayCtx.quadraticCurveTo(x + w, y, x + w, y + r);
    replayCtx.lineTo(x + w, y + h - r);
    replayCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    replayCtx.lineTo(x + r, y + h);
    replayCtx.quadraticCurveTo(x, y + h, x, y + h - r);
    replayCtx.lineTo(x, y + r);
    replayCtx.quadraticCurveTo(x, y, x + r, y);
    replayCtx.closePath();
  }

  function replayDrawExplosion(ex) {
    const now = performance.now();
    const t = (now - ex.start) / ex.duration;
    if (t >= 1) return false;
    const cx = ex.cx, cy = ex.cy;
    const ease = 1 - Math.pow(1 - t, 5);
    replayCtx.save();
    replayCtx.globalCompositeOperation = 'lighter';
    if (t < 0.35) {
      const coreT = t / 0.35;
      const coreRad = ex.maxRadius * 0.35 * (1 - coreT);
      if (coreRad > 0.5) {
        const g = replayCtx.createRadialGradient(cx, cy, 0, cx, cy, coreRad);
        g.addColorStop(0, `rgba(255, 255, 255, ${0.95 * (1 - coreT)})`);
        g.addColorStop(1, `rgba(200, 220, 255, 0)`);
        replayCtx.beginPath(); replayCtx.arc(cx, cy, coreRad, 0, Math.PI * 2);
        replayCtx.fillStyle = g; replayCtx.fill();
      }
    }
    const rad = ease * ex.maxRadius;
    const alpha = Math.pow(1 - t, 1.8);
    replayCtx.beginPath(); replayCtx.arc(cx, cy, rad, 0, Math.PI * 2);
    replayCtx.strokeStyle = `rgba(220, 240, 255, ${alpha})`;
    replayCtx.lineWidth = 1.5 + 3 * Math.max(0, 1 - t * 3);
    replayCtx.stroke();
    replayCtx.restore();
    return true;
  }

  function replayDrawWallExplosion(we) {
    const now = performance.now();
    const t = (now - we.start) / we.duration;
    if (t >= 1) return false;
    const scale = 1 + t * 0.6;
    const alpha = 1 - t;
    const r = Math.round(255 - t * 30);
    const g = Math.round(220 - t * 160);
    const b = Math.round(120 - t * 100);
    const color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
    replayCtx.save();
    if (we.type === 'H') {
      const y = R_PAD + (we.r + 1) * R_CELL - R_WALL_THICK / 2;
      const x = R_PAD + we.c * R_CELL + R_CELL * 0.08;
      const w = R_CELL * 2 - R_CELL * 0.16;
      const h = R_WALL_THICK;
      const cx = x + w / 2, cy = y + h / 2;
      const sw = w * scale, sh = h * scale;
      replayCtx.shadowColor = `rgba(255, 200, 80, ${alpha})`;
      replayCtx.shadowBlur = 20 * alpha;
      replayCtx.fillStyle = color;
      replayRoundRect(cx - sw / 2, cy - sh / 2, sw, sh, sh / 2); replayCtx.fill();
      replayCtx.shadowBlur = 0;
    } else {
      const x = R_PAD + (we.c + 1) * R_CELL - R_WALL_THICK / 2;
      const y = R_PAD + we.r * R_CELL + R_CELL * 0.08;
      const w = R_WALL_THICK;
      const h = R_CELL * 2 - R_CELL * 0.16;
      const cx = x + w / 2, cy = y + h / 2;
      const sw = w * scale, sh = h * scale;
      replayCtx.shadowColor = `rgba(255, 200, 80, ${alpha})`;
      replayCtx.shadowBlur = 20 * alpha;
      replayCtx.fillStyle = color;
      replayRoundRect(cx - sw / 2, cy - sh / 2, sw, sh, sw / 2); replayCtx.fill();
      replayCtx.shadowBlur = 0;
    }
    replayCtx.restore();
    return true;
  }

  function buildReplayMovesList() {
    movesListEl.innerHTML = '';
    const history = replayData.history || [];
    history.forEach((mv, i) => {
      const chip = document.createElement('div');
      chip.className = 'move-chip';
      chip.dataset.index = i;
      const dot = document.createElement('span');
      dot.className = 'move-dot';
      dot.style.background = mv.player === 1 ? COLOR_P1 : COLOR_P2;
      chip.appendChild(dot);
      const text = document.createElement('span');
      text.textContent = (i + 1) + '. ' + moveNotation(mv);
      chip.appendChild(text);
      movesListEl.appendChild(chip);
    });
    updateReplayMovesHighlight();
  }
  function updateReplayMovesHighlight() {
    const chips = movesListEl.children;
    for (let i = 0; i < chips.length; i++) {
      chips[i].classList.remove('current', 'future');
      if (i === replayStep - 1) chips[i].classList.add('current');
      else if (i >= replayStep) chips[i].classList.add('future');
    }
    const active = chips[replayStep - 1];
    if (active) {
      const listRect = movesListEl.getBoundingClientRect();
      const chipRect = active.getBoundingClientRect();
      const delta = (chipRect.left + chipRect.width / 2) - (listRect.left + listRect.width / 2);
      movesListEl.scrollLeft += delta;
    }
  }

  function rebuildReplayWallOwners() {
    const map = new Map();
    const history = (replayData && replayData.history) || [];
    for (const mv of history) {
      if (mv && mv.type === 'wall') {
        const key = `${(mv.orient || 'h').toUpperCase()}:${mv.r}:${mv.c}`;
        if (!map.has(key)) map.set(key, mv.player);
      }
    }
    return map;
  }

  function replayApplyStep(step, animate) {
    const oldP1 = [...replayP1], oldP2 = [...replayP2];
    replayP1 = [...replayData.startP1];
    replayP2 = [...replayData.startP2];
    replayWalls = [];
    replayExplosions = [];
    replayWallExplosions = [];
    replayBubbles = [];

    const history = replayData.history || [];
    for (let i = 0; i < step; i++) {
      const mv = history[i];
      if (!mv) continue;

      if (mv.type === 'move') {
        const to = mv.to || (mv.r !== undefined ? [mv.r, mv.c] : null);
        if (to) {
          if (mv.player === 1) replayP1 = [...to];
          else replayP2 = [...to];
        }
      } else if (mv.type === 'teleport') {
        if (mv.player === 1) replayP1 = [...mv.to];
        else replayP2 = [...mv.to];
      } else if (mv.type === 'wall') {
        replayWalls.push((mv.orient || 'h').toUpperCase() + ':' + mv.r + ':' + mv.c);
      } else if (mv.type === 'bubble_collect') {
        replayBubbles = replayBubbles.filter(b => !(b.r === mv.r && b.c === mv.c));
      } else if (mv.type === 'bubble_spawn') {
        replayBubbles.push({ r: mv.r, c: mv.c });
      } else if (mv.type === 'bomb') {
        if (mv.destroyed) {
          for (const dk of mv.destroyed) {
            const [t, r, c] = dk.split(':');
            const key = `${t}:${r}:${c}`;
            const idx = replayWalls.indexOf(key);
            if (idx !== -1) replayWalls.splice(idx, 1);
          }
        }
        if (i === step - 1 && animate) {
          const cx = R_PAD + mv.c * R_CELL + R_CELL / 2;
          const cy = R_PAD + mv.r * R_CELL + R_CELL / 2;
          replayExplosions.push({
            cx, cy,
            start: performance.now(),
            duration: 700,
            maxRadius: R_CELL * 1.05
          });
          if (mv.destroyed) {
            for (const dk of mv.destroyed) {
              const [t, r, c] = dk.split(':');
              replayWallExplosions.push({
                type: t, r: parseInt(r), c: parseInt(c),
                start: performance.now(),
                duration: 380
              });
            }
          }
        }
      }
    }

    if (animate && step > 0) {
      const mv = history[step - 1];
      if (mv && (mv.type === 'move' || mv.type === 'teleport')) {
        const who = mv.player === 1 ? 'p1' : 'p2';
        const from = who === 'p1' ? oldP1 : oldP2;
        const to = who === 'p1' ? replayP1 : replayP2;
        replayStartAnim(who, from[0], from[1], to[0], to[1]);
      }
    }
  }

  function replaySetStep(step, animate) {
    const len = (replayData.history || []).length;
    if (step < 0 || step > len) return;
    replayApplyStep(step, animate);
    replayStep = step;
    replayDraw();
    replayCounterCurrent.textContent = step;
    replayCounterTotal.textContent = len;
    replayProgress.style.width = (len ? (step / len) * 100 : 0) + '%';
    btnReplayPrev.disabled = step === 0;
    btnReplayNext.disabled = step === len;
    updateReplayMovesHighlight();
  }

  function showReplayScreen(data) {
    replayData = data;
    replayWallOwnerMap = rebuildReplayWallOwners();
    replayMode = data.gameMode || 'classic';
    replayPlates = data.plates || [];
    replayArrows = data.arrows || [];

    const p1 = data.players && data.players['1'] || {};
    const p2 = data.players && data.players['2'] || {};

    const chipP1 = document.getElementById('replayChipP1');
    const chipP2 = document.getElementById('replayChipP2');
    chipP1.style.borderColor = COLOR_P1;
    chipP2.style.borderColor = COLOR_P2;

    replayAvatarP1.style.background = COLOR_P1;
    replayAvatarP2.style.background = COLOR_P2;

    if (p1.photo) replayAvatarP1.innerHTML = `<img src="${p1.photo}" alt="" referrerpolicy="no-referrer">`;
    else replayAvatarP1.textContent = (p1.name || 'И').charAt(0).toUpperCase();
    if (p2.photo) replayAvatarP2.innerHTML = `<img src="${p2.photo}" alt="" referrerpolicy="no-referrer">`;
    else replayAvatarP2.textContent = (p2.name || 'И').charAt(0).toUpperCase();

    replayNameP1.textContent = p1.name || 'Игрок 1';
    replayNameP2.textContent = p2.name || 'Игрок 2';

    const modeName = MODE_NAMES[replayMode] || 'Классическая';
    replayModeTag.textContent = replayMode === 'classic' ? '' : modeName;

    showScreen('replay');
    requestAnimationFrame(() => {
      resizeReplayCanvas();
      buildReplayMovesList();
      replaySetStep(0, false);
    });
  }

  async function loadReplayInline(replayId) {
    try {
      const res = await api('/api/validate', {
        method: 'POST',
        body: JSON.stringify({ initData: tg.initData, room: 'replay_' + replayId }),
      });
      if (res.mode !== 'replay' || !res.replay) {
        showError('Повтор недоступен', 'Не удалось загрузить повтор.');
        return;
      }
      showReplayScreen(res.replay);
    } catch (e) {
      showError('Ошибка', e.message || 'Не удалось загрузить повтор.');
    }
  }

  btnReplayPrev.addEventListener('click', () => { if (replayStep > 0) replaySetStep(replayStep - 1, false); });
  btnReplayNext.addEventListener('click', () => { if (replayStep < (replayData.history || []).length) replaySetStep(replayStep + 1, true); });

  btnReplayShare.addEventListener('click', () => {
    const rid = (replayData && (replayData.id || replayData.replayId)) || roomCode;
    if (!rid) return;
    if (tg && tg.switchInlineQuery) {
      try { tg.switchInlineQuery('replay_' + rid, ['users', 'groups', 'channels']); }
      catch (e) {}
    }
  });

  let replayTouchX = null;
  replayCanvas.addEventListener('touchstart', (e) => { replayTouchX = e.touches[0].clientX; }, { passive: true });
  replayCanvas.addEventListener('touchend', (e) => {
    if (replayTouchX === null) return;
    const dx = e.changedTouches[0].clientX - replayTouchX;
    const len = (replayData && replayData.history || []).length;
    if (Math.abs(dx) > 50) {
      if (dx < 0 && replayStep < len) replaySetStep(replayStep + 1, true);
      if (dx > 0 && replayStep > 0) replaySetStep(replayStep - 1, false);
    }
    replayTouchX = null;
  });

  // ============================================================
  // BOOTSTRAP
  // ============================================================
  async function bootstrap() {
    if (!tg || !tg.initData) {
      showError('Откройте в Telegram', 'Эта игра работает только внутри Telegram Mini App.');
      return;
    }
    const startParam = tg.initDataUnsafe?.start_param || '';
    if (!startParam) {
      showError('Нет параметра', 'Ссылка не содержит код комнаты или ID повтора.');
      return;
    }

    loadingMsg.textContent = 'Авторизация…';
    roomCode = startParam;

    try {
      const res = await api('/api/validate', {
        method: 'POST',
        body: JSON.stringify({ initData: tg.initData, room: roomCode }),
      });
      myUser = res.user;

      if (res.mode === 'replay') {
        mode = 'replay';
        showReplayScreen(res.replay);
        return;
      }

      myPlayer = res.player;
      isObserver = !!res.isObserver;
      gameMode = res.gameMode || 'classic';

      if (gameMode === 'bombs') {
        myBombsEl.style.display = 'grid';
        enemyBombsEl.style.display = 'grid';
        btnBomb.classList.remove('hidden');
      }

      const s = await api(`/api/state/${roomCode}`);
      applyState(s);
      resizeCanvas();

      if (s.started) {
        refresh();
        showScreen('game');
        if (s.gameOver && s.winner) handleGameOver(s.winner, s.replayId);
        else startPolling();
      } else {
        waitingTitle.textContent = 'Ожидание второго игрока';
        waitingMsg.textContent = 'Игра начнётся автоматически, как только кто-то присоединится.';
        showScreen('waiting');
        startPolling();
      }
    } catch (e) {
      if (e.status === 410) {
        const replayId = e.replayId || (e.data && e.data.replayId) || null;
        if (replayId) showErrorWithReplay('Игра завершена', 'Комната закрыта после победы. Можно посмотреть повтор.', replayId);
        else showError('Игра завершена', 'Эта комната закрыта.');
        return;
      }
      if (e.status === 404) showError('Не найдено', 'Комната или повтор не существует.');
      else if (e.status === 409) showError('Комната заполнена', 'Уже играют двое.');
      else if (e.status === 401) showError('Ошибка авторизации', 'Не удалось проверить подпись Telegram.');
      else showError('Ошибка', e.message || 'Что-то пошло не так.');
    }
  }

  // ============================================================
  // POINTER / DRAG
  // ============================================================
  function getBoardRect() { return canvas.getBoundingClientRect(); }
  function getPointerPos(e) {
    const isTouch = !!(e.touches && e.touches.length);
    const touch = isTouch ? e.touches[0] : e;
    return { x: touch.clientX, y: touch.clientY - (isTouch ? FINGER_OFFSET_Y : 0) };
  }
  function toCanvasXY(cx, cy) {
    const rect = getBoardRect();
    const sx = rect.width / (canvas.width / (window.devicePixelRatio || 1));
    const sy = rect.height / (canvas.height / (window.devicePixelRatio || 1));
    return { x: (cx - rect.left) / sx, y: (cy - rect.top) / sy };
  }
  function getWallCoordinates(clientX, clientY, orient) {
    const p = toCanvasXY(clientX, clientY);
    let viewC, viewR;
    if (orient === 'h') { viewC = Math.floor((p.x - PAD) / CELL); viewR = Math.round((p.y - PAD) / CELL) - 1; }
    else { viewC = Math.round((p.x - PAD) / CELL) - 1; viewR = Math.floor((p.y - PAD) / CELL); }
    viewC = Math.max(0, Math.min(N - 2, viewC));
    viewR = Math.max(0, Math.min(N - 2, viewR));
    let r, c;
    if (myPlayer === 1) { r = viewR; c = viewC; }
    else { r = N - 2 - viewR; c = N - 2 - viewC; }
    const cx = PAD + (viewC + 1) * CELL;
    const cy = PAD + (viewR + 1) * CELL;
    const dist = Math.hypot(p.x - cx, p.y - cy);
    const isInsideBoard = dist < CELL * 1.5;
    const valid = orient === 'h' ? canPlaceHClient(r, c) : canPlaceVClient(r, c);
    return { orient, r, c, viewR, viewC, cx, cy, valid, isInsideBoard };
  }
  function isPointerOverBoard(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const margin = 40;
    return clientX >= rect.left - margin && clientX <= rect.right + margin
        && clientY >= rect.top - margin && clientY <= rect.bottom + margin;
  }

  function startDrag(e, orient) {
    if (isObserver) return;
    if (!state || state.gameOver || sending || eventPlaying) return;
    if (state.current !== myPlayer) return;
    const myLeft = myPlayer === 1 ? state.left1 : state.left2;
    if (myLeft <= 0) return;
    e.preventDefault();
    const pos = getPointerPos(e);
    const p = toCanvasXY(pos.x, pos.y);
    dragState = { orient, startX: pos.x, startY: pos.y, animX: p.x, animY: p.y, targetX: p.x, targetY: p.y, preview: null, moved: false };
    requestAnimationFrame(animDragLoop);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd);
    document.addEventListener('touchcancel', onDragEnd);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  }
  function animDragLoop() {
    if (!dragState) return;
    dragState.animX = lerp(dragState.animX, dragState.targetX, LERP_FACTOR);
    dragState.animY = lerp(dragState.animY, dragState.targetY, LERP_FACTOR);
    if (Math.abs(dragState.animX - dragState.targetX) < 0.3) dragState.animX = dragState.targetX;
    if (Math.abs(dragState.animY - dragState.targetY) < 0.3) dragState.animY = dragState.targetY;
    draw();
    requestAnimationFrame(animDragLoop);
  }
  function onDragMove(e) {
    if (!dragState) return;
    e.preventDefault();
    const pos = getPointerPos(e);
    if (Math.hypot(pos.x - dragState.startX, pos.y - dragState.startY) > DRAG_MOVE_THRESHOLD) dragState.moved = true;
    const p = toCanvasXY(pos.x, pos.y);
    dragState.targetX = p.x; dragState.targetY = p.y;
    const overBoard = isPointerOverBoard(pos.x, pos.y);
    if (overBoard) {
      const wallData = getWallCoordinates(pos.x, pos.y, dragState.orient);
      if (wallData.isInsideBoard && wallData.valid) dragState.preview = wallData;
      else dragState.preview = null;
    } else dragState.preview = null;
  }
  function onDragEnd(e) {
    if (!dragState) return;
    const ds = dragState;
    dragState = null;
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend', onDragEnd);
    document.removeEventListener('touchcancel', onDragEnd);
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);

    let endX = null, endY = null;
    if (e && e.changedTouches && e.changedTouches.length) { endX = e.changedTouches[0].clientX; endY = e.changedTouches[0].clientY; }
    else if (e && e.clientX !== undefined) { endX = e.clientX; endY = e.clientY; }
    const overBoard = (endX !== null && endY !== null) ? isPointerOverBoard(endX, endY) : false;

    if (ds.preview && ds.preview.valid && ds.moved && overBoard) {
      startSendingVisual(ds.preview.orient);
      sendMove({ type: 'wall', orient: ds.preview.orient, r: ds.preview.r, c: ds.preview.c });
    } else draw();
  }
  function attachDrag(el) {
    const orient = el.dataset.orient;
    const handler = (e) => startDrag(e, orient);
    el.addEventListener('touchstart', handler, { passive: false });
    el.addEventListener('mousedown', handler);
  }
  function startSendingVisual(orient) {
    sending = true;
    myPanel.classList.add('sending');
    myDrags.querySelectorAll('.drag-item').forEach(item => { if (item.dataset.orient === orient) item.classList.add('sending'); });
    refresh();
  }
  function stopSendingVisual() {
    sending = false;
    myPanel.classList.remove('sending');
    myDrags.querySelectorAll('.drag-item').forEach(item => item.classList.remove('sending'));
    refresh();
  }
  async function sendMove(action) {
    if (isObserver) { stopSendingVisual(); return; }
    if (!roomCode) { stopSendingVisual(); return; }
    try {
      const res = await api(`/api/move/${roomCode}`, {
        method: 'POST',
        body: JSON.stringify({ player: myPlayer, action }),
      });
      const newState = { ...state, ...res };
      applyState(newState);
      if (newState.gameOver && newState.winner) handleGameOver(newState.winner, newState.replayId);
    } catch (e) {
      if (e.status === 410 || e.status === 404) {
        const replayId = e.replayId || (e.data && e.data.replayId) || null;
        if (replayId) showErrorWithReplay('Игра завершена', 'Комната закрыта после победы.', replayId);
        else handleGameOver(0, null);
        return;
      }
      try { await fetchState(); } catch (e2) {}
    } finally {
      stopSendingVisual();
    }
  }
  function onBoardClick(e) {
    if (isObserver) return;
    if (!state || state.gameOver || sending || eventPlaying) return;
    if (state.current !== myPlayer) return;
    if (dragState) return;
    const touch = e.changedTouches ? e.changedTouches[0] : e;
    const p = toCanvasXY(touch.clientX, touch.clientY);
    const vcol = Math.floor((p.x - PAD) / CELL);
    const vrow = Math.floor((p.y - PAD) / CELL);
    if (vrow < 0 || vrow >= N || vcol < 0 || vcol >= N) return;
    const row = fromViewR(vrow);
    const col = fromViewC(vcol);
    const active = myPlayer === 1 ? state.p1 : state.p2;
    if (row === active[0] && col === active[1]) return;
    const allowed = getAvailableMoves(myPlayer);
    if (allowed.some(([r, c]) => r === row && c === col)) {
      sending = true;
      myPanel.classList.add('sending');
      refresh();
      sendMove({ type: 'move', r: row, c: col });
    }
  }

  canvas.addEventListener('click', onBoardClick);
  canvas.addEventListener('touchend', (e) => {
    if (dragState) return;
    if (e.changedTouches.length) onBoardClick({ changedTouches: [e.changedTouches[0]] });
  });

  document.querySelectorAll('.drag-item').forEach(attachDrag);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (screens.game.classList.contains('active') && canvas.width) { resizeCanvas(); draw(); }
      if (screens.replay.classList.contains('active') && replayCanvas.width) { resizeReplayCanvas(); replayDraw(); }
    }, 60);
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if (screens.game.classList.contains('active') && canvas.width) { resizeCanvas(); draw(); }
      if (screens.replay.classList.contains('active') && replayCanvas.width) { resizeReplayCanvas(); replayDraw(); }
    }, 300);
  });

  buildDots(myDotsEl, WALLS_PER_PLAYER);
  buildDots(enemyDotsEl, WALLS_PER_PLAYER);
  buildDots(myBombsEl, MAX_BOMBS);
  buildDots(enemyBombsEl, MAX_BOMBS);

  bootstrap();
})();
</script>
</body>
</html>
