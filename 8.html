<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Virrdor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  :root {
    --bg: #1e1f22; --panel: #27292d; --panel-edge: #33363b;
    --text: #dcdad6; --text-dim: #86898f;
    --p1: #c96b5c; --p2: #6b90b8;
    --p1-soft: #3a2b28; --p2-soft: #2a3340;
    --gold: #e8c96a; --danger: #d9534f; --disabled: #3a3d43;
    --boom: #f0b429;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif; color: var(--text); touch-action: none; overscroll-behavior: none; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .4s ease; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
  .screen.active { opacity: 1; pointer-events: auto; }

  .centered { align-items: center; justify-content: center; padding: 30px; text-align: center; }
  .spinner-big { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--p1); border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .centered .msg { font-size: 15px; color: var(--text-dim); max-width: 300px; line-height: 1.5; }
  .centered .title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
  .error-actions { margin-top: 24px; display: flex; justify-content: center; width: 100%; max-width: 320px; }
  .error-actions .btn { min-width: 180px; }

  .game { display: flex; flex-direction: column; }
  .board-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; min-height: 0; background: var(--bg); }
  .board-wrap { position: relative; touch-action: none; }
  canvas { display: block; border-radius: 14px; background: #2a2d32; }

  .obs-badge {
    position: absolute; top: 22px; right: 22px;
    display: none; align-items: center; gap: 6px;
    padding: 5px 10px 5px 8px; border-radius: 999px;
    background: rgba(20, 21, 24, 0.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text); font-size: 13px; font-weight: 700;
    z-index: 10; cursor: pointer; user-select: none;
    font-variant-numeric: tabular-nums;
    transition: transform .12s ease;
  }
  .obs-badge:active { transform: scale(0.94); }
  .obs-badge.visible { display: inline-flex; }
  .obs-badge .eye { width: 16px; height: 16px; opacity: 0.85; flex-shrink: 0; }
  .obs-badge .cnt { color: var(--text); line-height: 1; padding: 0 2px; }
  .obs-stack { display: flex; align-items: center; padding-left: 4px; }
  .obs-stack .obs-ava { width: 20px; height: 20px; border-radius: 50%; margin-left: -7px; border: 2px solid rgba(20, 21, 24, 0.9); overflow: hidden; flex-shrink: 0; background: #3a3d43; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #1e1f22; }
  .obs-stack .obs-ava:first-child { margin-left: 0; }
  .obs-stack .obs-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .panel { flex: 0 0 auto; background: var(--panel); display: flex; flex-direction: column; padding: 8px 10px; gap: 8px; position: relative; z-index: 5; transition: background .3s; }
  .enemy-panel { border-bottom: 1px solid var(--panel-edge); }
  .my-panel { border-top: 1px solid var(--panel-edge); }
  .enemy-panel.active-1, .my-panel.active-1 { background: #2b2927; }
  .enemy-panel.active-2, .my-panel.active-2 { background: #262a30; }

  .panel-head { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #1e1f22; transition: transform .25s; overflow: hidden; position: relative; }
  .avatar.me-1 { background: var(--p1); }
  .avatar.me-2 { background: var(--p2); }
  .avatar.active { transform: scale(1.08); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .panel-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .panel-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-turn { font-size: 11px; font-weight: 600; color: var(--text-dim); opacity: 0; transition: opacity .2s; letter-spacing: 0.4px; text-transform: uppercase; }
  .panel-turn.show { opacity: 1; }
  .enemy-panel.active-1 .panel-turn, .my-panel.active-1 .panel-turn { color: var(--p1); }
  .enemy-panel.active-2 .panel-turn, .my-panel.active-2 .panel-turn { color: var(--p2); }

  .panel-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .flag-btn { width: 34px; height: 34px; border-radius: 10px; background: transparent; border: none; color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s, color .2s; flex-shrink: 0; }
  .flag-btn:hover { background: #33363b; color: var(--danger); }
  .flag-btn:active { transform: scale(0.94); }
  .flag-btn svg { width: 18px; height: 18px; }
  .flag-btn.hidden { display: none; }

  .stat-row { display: flex; align-items: center; gap: 10px; }
  .stat-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px 6px; }
  .stat-group.bombs { grid-template-columns: repeat(3, 1fr); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #3a3d43; justify-self: center; transition: background .25s; }
  .dot.me-1 { background: var(--p1); }
  .dot.me-2 { background: var(--p2); }
  .dot.bomb { background: var(--boom); }
  .dot.bomb.empty { background: #3a3d43; }

  .draggables { display: flex; gap: 8px; margin-top: 2px; }
  .draggables.hidden { display: none; }
  .drag-item { flex: 1; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; position: relative; transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s; }
  .drag-item:active { transform: scale(0.92); opacity: 0.7; }
  .drag-item.me-1 { background: var(--p1-soft); box-shadow: inset 0 0 0 1.5px rgba(201,107,92,0.4); }
  .drag-item.me-1 .icon { background: var(--p1); }
  .drag-item.me-2 { background: var(--p2-soft); box-shadow: inset 0 0 0 1.5px rgba(107,144,184,0.4); }
  .drag-item.me-2 .icon { background: var(--p2); }
  .drag-item.disabled { opacity: 0.25; pointer-events: none; }
  .drag-item .icon { width: 60px; height: 7px; border-radius: 4px; }
  .drag-item.vertical .icon { width: 7px; height: 60px; }

  .drag-item .sending-overlay { position: absolute; inset: 0; border-radius: 14px; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; }
  .drag-item.sending .sending-overlay { display: flex; animation: sendingPulse 0.7s ease-in-out infinite alternate; }
  @keyframes sendingPulse { from { background: rgba(0,0,0,0.15); } to { background: rgba(0,0,0,0.45); } }
  .drag-item .sending-overlay .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }

  .my-panel.sending { animation: panelFlash 0.6s ease-in-out infinite alternate; }
  @keyframes panelFlash { from { background: var(--panel); } to { background: #303339; } }

  .bomb-btn {
    width: 100%; height: 54px;
    border-radius: 14px; border: none; font-family: inherit;
    font-size: 15px; font-weight: 700; color: #e8c96a;
    background: rgba(240, 180, 41, 0.12);
    box-shadow: inset 0 0 0 1.5px rgba(240, 180, 41, 0.35);
    cursor: pointer; transition: transform .12s, background .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .bomb-btn:active { transform: scale(0.97); }
  .bomb-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .bomb-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .bomb-btn .cnt { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 17px; }
  .bomb-btn.hidden { display: none; }

  .win-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 30px 24px; overflow: hidden; background: radial-gradient(ellipse at 50% 25%, rgba(232,201,106,0.10), transparent 60%), radial-gradient(ellipse at 50% 100%, rgba(201,107,92,0.06), transparent 60%), var(--bg); opacity: 0; pointer-events: none; transition: opacity .45s ease; z-index: 50; }
  .win-screen.show { opacity: 1; pointer-events: auto; }

  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; opacity: 0.9; animation: fall linear infinite; }
  .confetti i:nth-child(1) { left:  5%; background:#e8c96a; animation-duration: 4.2s; animation-delay: -0.4s; transform: rotate(20deg); }
  .confetti i:nth-child(2) { left: 12%; background:#c96b5c; animation-duration: 5.1s; animation-delay: -1.8s; transform: rotate(80deg); }
  .confetti i:nth-child(3) { left: 19%; background:#6b90b8; animation-duration: 3.8s; animation-delay: -0.9s; transform: rotate(140deg); }
  .confetti i:nth-child(4) { left: 27%; background:#e8c96a; animation-duration: 5.4s; animation-delay: -2.3s; transform: rotate(60deg); }
  .confetti i:nth-child(5) { left: 34%; background:#dcdad6; animation-duration: 4.6s; animation-delay: -1.1s; transform: rotate(30deg); }
  .confetti i:nth-child(6) { left: 41%; background:#c96b5c; animation-duration: 5.8s; animation-delay: -3.0s; transform: rotate(120deg); }
  .confetti i:nth-child(7) { left: 48%; background:#6b90b8; animation-duration: 4.0s; animation-delay: -0.6s; transform: rotate(75deg); }
  .confetti i:nth-child(8) { left: 55%; background:#e8c96a; animation-duration: 5.0s; animation-delay: -2.7s; transform: rotate(200deg); }
  .confetti i:nth-child(9) { left: 62%; background:#dcdad6; animation-duration: 4.4s; animation-delay: -1.5s; transform: rotate(45deg); }
  .confetti i:nth-child(10){ left: 69%; background:#c96b5c; animation-duration: 5.6s; animation-delay: -0.2s; transform: rotate(170deg); }
  .confetti i:nth-child(11){ left: 76%; background:#6b90b8; animation-duration: 4.8s; animation-delay: -2.0s; transform: rotate(90deg); }
  .confetti i:nth-child(12){ left: 83%; background:#e8c96a; animation-duration: 5.2s; animation-delay: -3.4s; transform: rotate(230deg); }
  .confetti i:nth-child(13){ left: 90%; background:#dcdad6; animation-duration: 4.1s; animation-delay: -1.9s; transform: rotate(110deg); }
  .confetti i:nth-child(14){ left: 96%; background:#c96b5c; animation-duration: 5.5s; animation-delay: -2.6s; transform: rotate(55deg); }
  .confetti i:nth-child(15){ left:  8%; background:#6b90b8; animation-duration: 6.0s; animation-delay: -4.1s; transform: rotate(15deg); }
  .confetti i:nth-child(16){ left: 25%; background:#e8c96a; animation-duration: 6.3s; animation-delay: -3.7s; transform: rotate(160deg); }
  .confetti i:nth-child(17){ left: 42%; background:#c96b5c; animation-duration: 5.9s; animation-delay: -4.5s; transform: rotate(95deg); }
  .confetti i:nth-child(18){ left: 58%; background:#6b90b8; animation-duration: 6.6s; animation-delay: -3.2s; transform: rotate(210deg); }
  .confetti i:nth-child(19){ left: 74%; background:#e8c96a; animation-duration: 6.1s; animation-delay: -4.8s; transform: rotate(40deg); }
  .confetti i:nth-child(20){ left: 88%; background:#dcdad6; animation-duration: 6.4s; animation-delay: -3.9s; transform: rotate(130deg); }
  @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 0; } 10% { opacity: 0.9; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0.85; } }

  .win-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 420px; flex: 1; justify-content: center; padding: 20px 0; min-height: 0; }
  .winner-block { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 34px; }
  .winner-avatar-wrap { position: relative; width: 116px; height: 116px; display: flex; align-items: center; justify-content: center; }
  .winner-avatar { width: 116px; height: 116px; border-radius: 50%; background: #2e3136; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800; color: #1e1f22; box-shadow: 0 0 0 5px var(--p1), 0 0 0 9px rgba(232,201,106,0.35), 0 20px 44px rgba(0,0,0,0.55); position: relative; z-index: 2; }
  .winner-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .winner-avatar.is-p2 { box-shadow: 0 0 0 5px var(--p2), 0 0 0 9px rgba(232,201,106,0.35), 0 20px 44px rgba(0,0,0,0.55); }
  .crown { position: absolute; top: -32px; left: 50%; transform: translateX(-50%); width: 66px; height: 48px; z-index: 3; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45)); animation: crownFloat 2.8s ease-in-out infinite; }
  @keyframes crownFloat { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-4px); } }
  .winner-label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .winner-name { font-size: 28px; font-weight: 800; color: var(--text); text-align: center; letter-spacing: -0.3px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loser-block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .loser-avatar { width: 58px; height: 58px; border-radius: 50%; background: #2e3136; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #1e1f22; box-shadow: 0 0 0 3px rgba(134,137,143,0.35), 0 8px 20px rgba(0,0,0,0.4); }
  .loser-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .loser-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
  .loser-name { font-size: 13px; color: var(--text-dim); font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .win-footer { position: relative; z-index: 2; width: 100%; max-width: 420px; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .btn-close { width: 100%; border: none; font-family: inherit; font-size: 16px; font-weight: 700; padding: 16px 20px; border-radius: 14px; cursor: pointer; color: #1e1f22; background: var(--gold); transition: transform .1s, background .2s; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  .btn-close:active { transform: scale(0.98); }
  .btn-share { width: 100%; border: none; font-family: inherit; font-size: 15px; font-weight: 700; padding: 15px 20px; border-radius: 14px; cursor: pointer; color: var(--text); background: transparent; box-shadow: inset 0 0 0 1.5px var(--panel-edge); transition: transform .1s, background .2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-share:active { transform: scale(0.98); }
  .btn-share svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .replay-screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
  .replay-header { flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--panel-edge); display: flex; flex-direction: column; }
  .players-row { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 360px; margin: 0 auto; padding: 12px 16px; }
  .player-chip { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 24px; background: #2e3136; min-width: 0; flex: 1; max-width: 160px; border: 2px solid transparent; transition: border-color .2s; }
  .player-chip.right { flex-direction: row-reverse; padding: 4px 4px 4px 12px; }
  .player-chip .pavatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #1e1f22; overflow: hidden; }
  .player-chip .pavatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .player-chip .pname { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .players-vs { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; flex-shrink: 0; }
  .replay-mode-tag { text-align: center; font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; padding-bottom: 8px; }

  .replay-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; }
  .replay-body .board-area { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .replay-body canvas { border-radius: 14px; background: #2a2d32; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }

  .replay-footer { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--panel-edge); display: flex; flex-direction: column; position: relative; }
  .replay-progress { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: transparent; }
  .replay-progress .bar { height: 100%; background: var(--gold); transition: width .25s ease; width: 0%; }

  .moves-list { display: flex; gap: 8px; padding: 12px 14px; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; background: #232529; }
  .moves-list::-webkit-scrollbar { display: none; }
  .move-chip { flex-shrink: 0; padding: 6px 12px; border-radius: 10px; background: #2e3136; color: #b5b8bd; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: 0.2px; transition: background .2s, color .2s, transform .2s; display: inline-flex; align-items: center; }
  .move-chip.current { background: #3d4046; color: #e6e4e0; transform: scale(1.04); }
  .move-chip.future { color: #6f7278; }
  .move-chip .move-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }

  .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px 12px 20px; }
  .nav-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: #33363b; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .12s, background .2s, color .2s; flex-shrink: 0; }
  .nav-btn:active:not(:disabled) { transform: scale(0.94); }
  .nav-btn:disabled { background: transparent; color: var(--disabled); box-shadow: inset 0 0 0 1.5px var(--panel-edge); cursor: not-allowed; }
  .nav-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .nav-counter { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; }
  .nav-counter .current { font-size: 22px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
  .nav-counter .current .sep { color: var(--text-dim); margin: 0 6px; font-weight: 600; }
  .nav-counter .current .total { color: var(--text-dim); font-weight: 600; }
  .nav-counter .label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); font-weight: 600; margin-top: 2px; }

  .share-row { padding: 0 20px 20px 20px; }
  .btn-share-replay {
    width: 100%; border: none; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 14px 20px; border-radius: 14px; cursor: pointer; color: var(--text);
    background: transparent; box-shadow: inset 0 0 0 1.5px var(--panel-edge);
    transition: transform .1s, background .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-share-replay:active { transform: scale(0.98); }
  .btn-share-replay svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .dialog-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 200; padding: 20px; }
  .dialog-backdrop.show { opacity: 1; pointer-events: auto; }
  .dialog { background: var(--panel); border-radius: 20px; padding: 26px 24px; width: 100%; max-width: 340px; transform: scale(0.92); transition: transform .25s; box-shadow: 0 20px 60px rgba(0,0,0,0.6); text-align: center; }
  .dialog-backdrop.show .dialog { transform: scale(1); }
  .dialog-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .dialog-text { font-size: 14px; color: var(--text-dim); line-height: 1.45; margin-bottom: 20px; }
  .dialog-actions { display: flex; gap: 10px; }
  .btn { border: none; font-family: inherit; font-size: 15px; font-weight: 700; padding: 14px 18px; border-radius: 12px; cursor: pointer; letter-spacing: 0.3px; color: var(--text); flex: 1; }
  .btn-primary { background: var(--p1); color: #1e1f22; }
  .btn-secondary { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--panel-edge); }

<script>
(function(){
  const API_BASE = 'https://api.vidokl.xyz';
  const N = 9;

  const DIRS_ORTHO = [[-1,0],[1,0],[0,-1],[0,1]];

  const COLOR_P1 = '#c96b5c';

  const WIND_WAVE_DURATION = 600;
  const WIND_PUSH_DURATION = 450;

  const TRAP_SPIN_DURATION = 700;
  const WALL_HP_MAX = 3;
  const TRAP_HP_MAX = 2;
  const VISION_RADIUS = 1;

  const MODE_NAMES = {
    classic: 'Классическая', free: 'Свободная', plates: 'Плитки',
    infinite_walls: 'Бесконечные стены', bombs: 'Бомба', arrows: 'Стрелки',
    phantom: 'Фантомные стены', fragile: 'Хрупкие стены', movers: 'Двигатели',
    traps: 'Ловушки', bushes: 'Кусты', wind: 'Ветер',
  };

  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
  function easeInOutQuad(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function chess(r, c) { return String.fromCharCode(97 + c) + (N - r); }

  let myPlayer = null;
  let isObserver = false;
  let roomCode = null;
  let mode = 'game';
  let gameMode = 'classic';
  let state = null;
  let pollTimer = null;
  let dragState = null;
  let pieceAnim = { p1: null, p2: null };
  let teleportAnim = null;
  let explosions = [];
  let wallExplosions = [];
  let eventQueue = [];
  let eventPlaying = false;
  let visualP1 = [0, 0];
  let visualP2 = [0, 0];

  // Муверы: предыдущее состояние + время старта анимации. Интерполируем всегда от prev к current.
  let moversPrev = null;
  let moversAnimStart = 0;

  let windWave = null;
  let windPush = null;
  let trapSpins = new Map();
  let lastAnimatedTurnIndex = 0;
  let animRaf = null;
  let sending = false;
  let myUser = null;
  let playersMeta = {};
  let observersList = [];
  let lastGameOverShown = false;
  let wallOwnerMap = new Map();

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#1e1f22'); tg.setBackgroundColor('#1e1f22'); } catch (e) {}
  }

  function getViewAsPlayer() { if (isObserver) return 1; return myPlayer || 1; }
  // Зеркалирование КЛЕТОК
  function toViewR(r) { const v = getViewAsPlayer(); return v === 1 ? r : N - 1 - r; }
  function toViewC(c) { const v = getViewAsPlayer(); return v === 1 ? c : N - 1 - c; }
  function fromViewR(r) { const v = getViewAsPlayer(); return v === 1 ? r : N - 1 - r; }
  function fromViewC(c) { const v = getViewAsPlayer(); return v === 1 ? c : N - 1 - c; }
  // Зеркалирование УЗЛОВ СЕТКИ (для стен, муверов, взрывов стен)
  function toViewWallR(r) { const v = getViewAsPlayer(); return v === 1 ? r : N - 2 - r; }
  function toViewWallC(c) { const v = getViewAsPlayer(); return v === 1 ? c : N - 2 - c; }
  function toViewDir(dir) {
    const v = getViewAsPlayer();
    if (v === 1) return dir;
    return { up: 'down', down: 'up', left: 'right', right: 'left' }[dir];
  }
  // Зеркалирование вектора направления (ветер и т.п.)
  function toViewVec(dr, dc) {
    const v = getViewAsPlayer();
    return v === 1 ? [dr, dc] : [-dr, -dc];
  }

  const screens = {
    loading: document.getElementById('screen-loading'),
    waiting: document.getElementById('screen-waiting'),
    error:   document.getElementById('screen-error'),
    game:    document.getElementById('screen-game'),
    replay:  document.getElementById('screen-replay'),
  };
  const loadingMsg = document.getElementById('loadingMsg');
  const errorTitle = document.getElementById('errorTitle');
  const errorMsg = document.getElementById('errorMsg');
  const errorActions = document.getElementById('errorActions');
  const waitingMsg = document.getElementById('waitingMsg');
  const waitingTitle = document.getElementById('waitingTitle');

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  const myAvatar = document.getElementById('myAvatar');
  const myPanel = document.getElementById('myPanel');
  const myTurn = document.getElementById('myTurn');
  const myDotsEl = document.getElementById('myDots');
  const myBombsEl = document.getElementById('myBombs');
  const myName = document.getElementById('myName');
  const myDrags = document.getElementById('myDrags');

  const enemyPanel = document.getElementById('enemyPanel');
  const enemyAvatar = document.getElementById('enemyAvatar');
  const enemyName = document.getElementById('enemyName');
  const enemyTurn = document.getElementById('enemyTurn');
  const enemyDotsEl = document.getElementById('enemyDots');
  const enemyBombsEl = document.getElementById('enemyBombs');

  const btnSurrender = document.getElementById('btnSurrender');
  const btnBomb = document.getElementById('btnBomb');
  const bombCnt = document.getElementById('bombCnt');

  const obsBadge = document.getElementById('obsBadge');
  const obsStack = document.getElementById('obsStack');
  const obsCount = document.getElementById('obsCount');

  const winScreen = document.getElementById('screen-win');
  const winnerAvatarEl = document.getElementById('winnerAvatar');
  const winnerNameEl = document.getElementById('winnerName');
  const loserAvatarEl = document.getElementById('loserAvatar');
  const loserNameEl = document.getElementById('loserName');
  const btnWinClose = document.getElementById('btnWinClose');
  const btnWinShare = document.getElementById('btnWinShare');

  const dialog = document.getElementById('dialog');
  const dialogTitle = document.getElementById('dialogTitle');
  const dialogText = document.getElementById('dialogText');
  const dialogActions = document.getElementById('dialogActions');

  let CELL = 0, PAD = 0, WALL_THICK = 0;
  function resizeCanvas() {
    const area = canvas.closest('.board-area');
    const rect = area.getBoundingClientRect();
    const size = Math.min(rect.width - 20, rect.height - 20);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    PAD = size * 0.04;
    CELL = (size - PAD * 2) / N;
    WALL_THICK = Math.max(4, CELL * 0.14);
  }

  async function api(path, opts = {}) {
    const res = await fetch(API_BASE + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      const e = new Error((data && data.error) || ('HTTP ' + res.status));
      e.status = res.status;
      e.data = data;
      e.replayId = data && data.replayId;
      throw e;
    }
    return data;
  }

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }
  function showError(title, msg) {
    errorTitle.textContent = title;
    errorMsg.textContent = msg;
    errorActions.innerHTML = '';
    showScreen('error');
  }
  function showErrorWithReplay(title, msg, replayId) {
    errorTitle.textContent = title;
    errorMsg.textContent = msg;
    errorActions.innerHTML = '';
    if (replayId) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = 'Смотреть повтор';
      btn.addEventListener('click', () => loadReplayInline(replayId));
      errorActions.appendChild(btn);
    }
    showScreen('error');
  }
  function showDialog(options) {
    dialogTitle.textContent = options.title || '';
    dialogText.textContent = options.text || '';
    dialogActions.innerHTML = '';
    const oldList = dialog.querySelector('.obs-popup-list');
    if (oldList) oldList.remove();
    const buttons = options.buttons || [{ label: 'ОК', primary: true }];
    buttons.forEach(btnOpt => {
      const b = document.createElement('button');
      b.className = 'btn ' + (btnOpt.danger ? 'btn-danger' : (btnOpt.primary ? 'btn-primary' : 'btn-secondary'));
      b.textContent = btnOpt.label;
      b.addEventListener('click', () => {
        if (btnOpt.closeAfter !== false) hideDialog();
        if (btnOpt.onClick) btnOpt.onClick();
      });
      dialogActions.appendChild(b);
    });
    dialog.classList.add('show');
  }
  function hideDialog() {
    dialog.classList.remove('show');
    const oldList = dialog.querySelector('.obs-popup-list');
    if (oldList) oldList.remove();
  }
  function showObserversPopup() {
    dialogTitle.textContent = 'Наблюдатели';
    dialogText.textContent = '';
    dialogActions.innerHTML = '';
    const list = document.createElement('div');
    list.className = 'obs-popup-list';
    if (!observersList.length) {
      const empty = document.createElement('div');
      empty.className = 'obs-popup-item';
      empty.textContent = 'Пока никого';
      list.appendChild(empty);
    } else {
      observersList.forEach(o => {
        const item = document.createElement('div');
        item.className = 'obs-popup-item';
        const ava = document.createElement('div');
        ava.className = 'op-ava';
        if (o.photo) ava.innerHTML = `<img src="${o.photo}" alt="" referrerpolicy="no-referrer">`;
        else ava.textContent = (o.name || '?').charAt(0).toUpperCase();
        const name = document.createElement('div');
        name.className = 'op-name';
        name.textContent = o.name || 'Наблюдатель';
        item.appendChild(ava);
        item.appendChild(name);
        list.appendChild(item);
      });
    }
    dialog.querySelector('.dialog').insertBefore(list, dialogActions);
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn btn-primary';
    closeBtn.textContent = 'Закрыть';
    closeBtn.addEventListener('click', hideDialog);
    dialogActions.appendChild(closeBtn);
    dialog.classList.add('show');
  }

  // ============================================================
  // ПАРСИНГ СТЕН
  // ============================================================
  function parseWallKey(k) {
    const parts = k.split(':');
    return {
      type: parts[0], r: +parts[1], c: +parts[2],
      player: parts.length > 3 ? +parts[3] : null,
    };
  }
  function findWall(t, r, c) {
    if (!state) return null;
    for (const k of state.walls) {
      const w = parseWallKey(k);
      if (w.type === t && w.r === r && w.c === c) return { key: k, ...w };
    }
    return null;
  }
  function wallExists(t, r, c) { return !!findWall(t, r, c); }

  function wallBlocksFor(wk, player) {
    if (gameMode !== 'phantom') return true;
    const w = parseWallKey(wk);
    return w.player !== player;
  }

  function _hEdgeBlocked(r, cL, player) {
    for (const [t, rr, cc] of [['V', r, cL], ['V', r - 1, cL]]) {
      const w = findWall(t, rr, cc);
      if (w && wallBlocksFor(w.key, player)) return true;
    }
    return false;
  }
  function _vEdgeBlocked(rT, c, player) {
    for (const [t, rr, cc] of [['H', rT, c], ['H', rT, c - 1]]) {
      const w = findWall(t, rr, cc);
      if (w && wallBlocksFor(w.key, player)) return true;
    }
    return false;
  }
  function isBlocked(r1, c1, r2, c2, player) {
    const dr = r2 - r1, dc = c2 - c1;
    if (dr === 0 && dc !== 0) return _hEdgeBlocked(r1, Math.min(c1, c2), player);
    if (dc === 0 && dr !== 0) return _vEdgeBlocked(Math.min(r1, r2), c1, player);
    if (dr !== 0 && dc !== 0) {
      const mr = Math.min(r1, r2), mc = Math.min(c1, c2);
      const path1_open = (!_hEdgeBlocked(r1, mc, player) && !_vEdgeBlocked(mr, c2, player));
      const path2_open = (!_vEdgeBlocked(mr, c1, player) && !_hEdgeBlocked(r2, mc, player));
      return !(path1_open || path2_open);
    }
    return false;
  }

  // Найти стену между двумя клетками (для fragile)
  function getWallBetween(r1, c1, r2, c2, player) {
    const dr = r2 - r1, dc = c2 - c1;
    if (dr === 0 && dc !== 0) {
      const mc = Math.min(c1, c2);
      const w1 = findWall('V', r1, mc);
      const w2 = findWall('V', r1 - 1, mc);
      if (w1 && wallBlocksFor(w1.key, player)) return w1;
      if (w2 && wallBlocksFor(w2.key, player)) return w2;
    }
    if (dc === 0 && dr !== 0) {
      const mr = Math.min(r1, r2);
      const w1 = findWall('H', mr, c1);
      const w2 = findWall('H', mr, c1 - 1);
      if (w1 && wallBlocksFor(w1.key, player)) return w1;
      if (w2 && wallBlocksFor(w2.key, player)) return w2;
    }
    return null;
  }

  function moverExists(t, r, c) {
    if (!state || !state.movers) return false;
    return state.movers.some(m => m.type === t && m.r === r && m.c === c);
  }

  function isPlate(r, c) {
    if (!state || !state.plates) return false;
    return state.plates.some(([pr, pc]) => pr === r && pc === c);
  }
  function isBush(r, c) {
    if (!state || !state.bushes) return false;
    return state.bushes.some(b => b.r === r && b.c === c);
  }
  function findTrap(r, c) {
    if (!state || !state.traps) return null;
    return state.traps.find(t => t.r === r && t.c === c) || null;
  }
  function cellLockedByTrap(r, c) {
    const t = findTrap(r, c);
    return !!(t && t.triggered && !t.broken);
  }
  function inVision(originPos, r, c) {
    const dr = Math.abs(originPos[0] - r);
    const dc = Math.abs(originPos[1] - c);
    return dr <= VISION_RADIUS && dc <= VISION_RADIUS;
  }

  // ВИДИМОСТЬ в кустах. Считаем от «меня» (myPlayer).
  //  - Свой игрок (myPlayer) виден ВСЕГДА (и в кустах, и вне).
  //  - Соперник:
  //      - если он не в кустах → виден
  //      - если он в кустах → виден только если попал в МОЁ поле зрения 3×3
  function getPieceAlpha(who) {
    if (gameMode !== 'bushes') return 1;
    const mySide = myPlayer || 1;
    if (who === mySide) return 1; // себя вижу всегда
    const pos = who === 1 ? state.p1 : state.p2;
    if (!isBush(pos[0], pos[1])) return 1;
    const myPos = mySide === 1 ? state.p1 : state.p2;
    if (inVision(myPos, pos[0], pos[1])) return 0.6;
    return 0;
  }

  // ============================================================
  // BFS
  // ============================================================
  function bfsHasPath(startR, startC, targetRow, player) {
    const visited = Array.from({ length: N }, () => new Array(N).fill(false));
    const queue = [[startR, startC]];
    visited[startR][startC] = true;
    const dirs = gameMode === 'free' ? DIRS_ORTHO.concat(DIRS_DIAG) : DIRS_ORTHO;

    while (queue.length) {
      const [r, c] = queue.shift();
      if (r === targetRow) return true;
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
        if (visited[nr][nc]) continue;
        if (isPlate(nr, nc)) continue;
        if (isBlocked(r, c, nr, nc, player)) continue;
        if (gameMode === 'movers' && dc === 0 && dr !== 0) {
          const mr = Math.min(r, nr);
          if (moverExists('H', mr, c) || moverExists('H', mr, c - 1)) continue;
        }
        visited[nr][nc] = true;
        queue.push([nr, nc]);
      }
    }
    return false;
  }
  function localCheckPaths() {
    if (!state) return true;
    return (bfsHasPath(state.p1[0], state.p1[1], 0, 1) &&
            bfsHasPath(state.p2[0], state.p2[1], N - 1, 2));
  }

  function canPlaceHClient(r, c) {
    if (r < 0 || r > N - 2 || c < 0 || c > N - 2) return false;
    if (wallExists('H', r, c) || wallExists('H', r, c - 1) || wallExists('H', r, c + 1)) return false;
    if (wallExists('V', r, c)) return false;
    if (gameMode === 'bombs') return true;
    const my = myPlayer || 1;
    state.walls.push(`H:${r}:${c}:${my}`);
    const ok = localCheckPaths();
    state.walls.pop();
    return ok;
  }
  function canPlaceVClient(r, c) {
    if (r < 0 || r > N - 2 || c < 0 || c > N - 2) return false;
    if (wallExists('V', r, c) || wallExists('V', r - 1, c) || wallExists('V', r + 1, c)) return false;
    if (wallExists('H', r, c)) return false;
    if (gameMode === 'bombs') return true;
    const my = myPlayer || 1;
    state.walls.push(`V:${r}:${c}:${my}`);
    const ok = localCheckPaths();
    state.walls.pop();
    return ok;
  }

  // ============================================================
  // СТРЕЛКИ
  // ============================================================
  const ARROW_DIR_DELTA = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };
  function arrowAt(r, c) {
    if (!state || !state.arrows) return null;
    return state.arrows.find(a => a.r === r && a.c === c) || null;
  }
  function arrowActive(a) {
    const [dr, dc] = ARROW_DIR_DELTA[a.dir];
    const tr = a.r + dr, tc = a.c + dc;
    if (tr < 0 || tr >= N || tc < 0 || tc >= N) return false;
    if (isBlocked(a.r, a.c, tr, tc, 0)) return false;
    return true;
  }
  function drawArrowOutline(a) {
    const x = PAD + toViewC(a.c) * CELL + CELL / 2;
    const y = PAD + toViewR(a.r) * CELL + CELL / 2;
    const viewDir = toViewDir(a.dir);
    const angle = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[viewDir];
    const active = arrowActive(a);
    ctx.strokeStyle = active ? 'rgba(170, 175, 182, 0.9)' : 'rgba(120, 125, 132, 0.35)';
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const size = CELL * 0.34;
    ctx.lineWidth = Math.max(1.5, CELL * 0.05);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.15, -size * 0.72);
    ctx.lineTo(-size * 0.15, -size * 0.22);
    ctx.lineTo(-size * 0.95, -size * 0.22);
    ctx.lineTo(-size * 0.95, size * 0.22);
    ctx.lineTo(-size * 0.15, size * 0.22);
    ctx.lineTo(-size * 0.15, size * 0.72);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function drawPlate(r, c) {
    const x = PAD + toViewC(c) * CELL;
    const y = PAD + toViewR(r) * CELL;
    const inset = CELL * 0.04;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(x + inset + 2, y + inset + 3, CELL - inset * 2, CELL - inset * 2, CELL * 0.12);
    ctx.fill();
    const grad = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
    grad.addColorStop(0, '#5a5e65');
    grad.addColorStop(0.5, '#4a4d52');
    grad.addColorStop(1, '#3d4045');
    ctx.fillStyle = grad;
    roundRect(x + inset, y + inset, CELL - inset * 2, CELL - inset * 2, CELL * 0.12);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(x + inset + 2, y + inset + 2, CELL - inset * 2 - 4, (CELL - inset * 2) * 0.4, CELL * 0.08);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    roundRect(x + inset, y + inset, CELL - inset * 2, CELL - inset * 2, CELL * 0.12);
    ctx.stroke();
  }

  function drawBush(r, c) {
    const x = PAD + toViewC(c) * CELL;
    const y = PAD + toViewR(r) * CELL;
    let alpha = 1;
    if (gameMode === 'bushes') {
      // Просветка — от МОЕГО игрока
      const mySide = myPlayer || 1;
      const myPos = mySide === 1 ? state.p1 : state.p2;
      if (inVision(myPos, r, c)) alpha = 0.6;
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    const pad = CELL * 0.04;
    const rad = CELL * 0.22;
    roundRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, rad);
    ctx.fillStyle = COLOR_BUSH;
    ctx.fill();
    ctx.strokeStyle = COLOR_BUSH_BORDER;
    ctx.lineWidth = Math.max(1, CELL * 0.03);
    ctx.stroke();
    ctx.restore();
  }

  function drawTrapWalls(trap) {
    const alpha = trap.hits === 0 ? 1.0 : 0.5;
    const key = `${trap.r}:${trap.c}`;
    let spinProgress = 1;
    let spinAngle = 0;
    if (trapSpins.has(key)) {
      const t = Math.min(1, (performance.now() - trapSpins.get(key)) / TRAP_SPIN_DURATION);
      spinProgress = easeOutCubic(t);
      spinAngle = (1 - spinProgress) * Math.PI * 4;
      if (t >= 1) trapSpins.delete(key);
    }

    const cx = PAD + toViewC(trap.c) * CELL + CELL / 2;
    const cy = PAD + toViewR(trap.r) * CELL + CELL / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.rotate(spinAngle);
    const scale = spinProgress;
    const halfLen = CELL * 0.75 / 2;
    const thick = WALL_THICK;
    const drawLocal = (lx, ly, type) => {
      ctx.save();
      ctx.scale(scale, scale);
      ctx.fillStyle = COLOR_TRAP;
      if (type === 'h') {
        const cxx = lx + CELL / 2, cyy = ly;
        roundRect(cxx - halfLen, cyy - thick / 2, halfLen * 2, thick, thick / 2);
        ctx.fill();
      } else {
        const cxx = lx, cyy = ly + CELL / 2;
        roundRect(cxx - thick / 2, cyy - halfLen, thick, halfLen * 2, thick / 2);
        ctx.fill();
      }
      ctx.restore();
    };
    if (trap.r > 0) drawLocal(-CELL / 2, -CELL / 2, 'h');
    if (trap.r < N - 1) drawLocal(-CELL / 2, CELL / 2, 'h');
    if (trap.c > 0) drawLocal(-CELL / 2, -CELL / 2, 'v');
    if (trap.c < N - 1) drawLocal(CELL / 2, -CELL / 2, 'v');
    ctx.restore();
  }

  function drawBubble(b) {
    const cx = PAD + toViewC(b.c) * CELL + CELL / 2;
    const cy = PAD + toViewR(b.r) * CELL + CELL / 2;
    const rad = CELL * 0.34;
    ctx.beginPath(); ctx.arc(cx, cy + 2, rad * 0.95, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(180, 200, 215, 0.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(220, 235, 245, 0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
    const grad = ctx.createRadialGradient(cx - rad * 0.35, cy - rad * 0.35, rad * 0.05, cx, cy, rad);
    grad.addColorStop(0, 'rgba(255,255,255,0.35)');
    grad.addColorStop(0.7, 'rgba(255,255,255,0.02)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath(); ctx.arc(cx - rad * 0.4, cy - rad * 0.42, rad * 0.14, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
  }

  // ============================================================
  // ВЗРЫВЫ
  // ============================================================
  function drawExplosion(ex) {
    const now = performance.now();
    const t = (now - ex.start) / ex.duration;
    if (t >= 1) return false;
    const cx = ex.cx, cy = ex.cy;
    const ease = 1 - Math.pow(1 - t, 5);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (t < 0.35) {
      const coreT = t / 0.35;
      const coreRad = ex.maxRadius * 0.35 * (1 - coreT);
      if (coreRad > 0.5) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRad);
        g.addColorStop(0, `rgba(255, 255, 255, ${0.95 * (1 - coreT)})`);
        g.addColorStop(1, `rgba(200, 220, 255, 0)`);
        ctx.beginPath(); ctx.arc(cx, cy, coreRad, 0, Math.PI * 2);
        ctx.fillStyle = g; ctx.fill();
      }
    }
    const rad = ease * ex.maxRadius;
    const alpha = Math.pow(1 - t, 1.8);
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(220, 240, 255, ${alpha})`;
    ctx.lineWidth = 1.5 + 3 * Math.max(0, 1 - t * 3);
    ctx.stroke();
    const rad2 = ease * ex.maxRadius * 0.72;
    if (rad2 > 0.5) {
      ctx.beginPath(); ctx.arc(cx, cy, rad2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(160, 200, 255, ${alpha * 0.45})`;
      ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
    return true;
  }

  function drawWallExplosion(we) {
    const now = performance.now();
    const t = (now - we.start) / we.duration;
    if (t >= 1) return false;
    const scale = 1 + t * 0.6;
    const alpha = 1 - t;
    const r = Math.round(255 - t * 30);
    const g = Math.round(220 - t * 160);
    const b = Math.round(120 - t * 100);
    const color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
    ctx.save();
    if (we.type === 'H') {
      const y = PAD + (toViewWallR(we.r) + 1) * CELL - WALL_THICK / 2;
      const x = PAD + toViewWallC(we.c) * CELL + CELL * 0.08;
      const w = CELL * 2 - CELL * 0.16;
      const h = WALL_THICK;
      const cx = x + w / 2, cy = y + h / 2;
      const sw = w * scale, sh = h * scale;
      ctx.shadowColor = `rgba(255, 200, 80, ${alpha})`;
      ctx.shadowBlur = 20 * alpha;
      ctx.fillStyle = color;
      roundRect(cx - sw / 2, cy - sh / 2, sw, sh, sh / 2); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      const x = PAD + (toViewWallC(we.c) + 1) * CELL - WALL_THICK / 2;
      const y = PAD + toViewWallR(we.r) * CELL + CELL * 0.08;
      const w = WALL_THICK;
      const h = CELL * 2 - CELL * 0.16;
      const cx = x + w / 2, cy = y + h / 2;
      const sw = w * scale, sh = h * scale;
      ctx.shadowColor = `rgba(255, 200, 80, ${alpha})`;
      ctx.shadowBlur = 20 * alpha;
      ctx.fillStyle = color;
      roundRect(cx - sw / 2, cy - sh / 2, sw, sh, sw / 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
    return true;
  }

  // ============================================================
  // МУВЕРЫ — интерполяция от moversPrev к state.movers
  // ============================================================
  function getMoverVisual(m) {
    if (!moversPrev) return { r: m.r, c: m.c };
    const prev = moversPrev.find(x => x.id === m.id);
    if (!prev) return { r: m.r, c: m.c };
    if (prev.r === m.r && prev.c === m.c) return { r: m.r, c: m.c };
    const t = Math.min(1, (performance.now() - moversAnimStart) / MOVER_DURATION);
    const e = easeInOutQuad(t);
    return {
      r: prev.r + (m.r - prev.r) * e,
      c: prev.c + (m.c - prev.c) * e,
    };
  }
  function drawMoverH(row, col) {
    const y = PAD + (toViewWallR(row) + 1) * CELL - WALL_THICK / 2;
    const x = PAD + toViewWallC(col) * CELL + CELL * 0.08;
    const w = CELL * 2 - CELL * 0.16;
    ctx.fillStyle = '#5e6773';
    roundRect(x + 1, y + 2.5, w, WALL_THICK, WALL_THICK / 2); ctx.fill();
    ctx.fillStyle = '#8a94a0';
    roundRect(x, y, w, WALL_THICK, WALL_THICK / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(x + CELL * 0.12, y + WALL_THICK * 0.22, w - CELL * 0.24, WALL_THICK * 0.28, WALL_THICK * 0.14); ctx.fill();
  }

  // ============================================================
  // ВЕТЕР — учитываем зеркалирование направления
  // ============================================================
  function drawWindWave() {
    if (!windWave) return;
    const elapsed = performance.now() - windWave.start;
    const t = Math.min(1, elapsed / WIND_WAVE_DURATION);
    if (t >= 1) return;

    // Зеркалим направление ветра под текущий вид
    const [vDirR, vDirC] = toViewVec(windWave.dirR, windWave.dirC);

    const boardX = PAD, boardY = PAD, boardSize = N * CELL;
    const thickness = CELL * 0.9;
    let waveX, waveY;

    if (vDirC !== 0) {
      const startX = vDirC > 0 ? boardX - thickness : boardX + boardSize + thickness;
      const endX = vDirC > 0 ? boardX + boardSize + thickness : boardX - thickness;
      waveX = startX + (endX - startX) * t;
      waveY = boardY + boardSize / 2;
    } else {
      const startY = vDirR > 0 ? boardY - thickness : boardY + boardSize + thickness;
      const endY = vDirR > 0 ? boardY + boardSize + thickness : boardY - thickness;
      waveY = startY + (endY - startY) * t;
      waveX = boardX + boardSize / 2;
    }

    const fade = Math.sin(Math.PI * t) * 0.55;
    ctx.save();
    if (vDirC !== 0) {
      const grad = ctx.createLinearGradient(waveX - thickness, 0, waveX + thickness, 0);
      grad.addColorStop(0, `rgba(168, 200, 232, 0)`);
      grad.addColorStop(0.5, `rgba(168, 200, 232, ${fade})`);
      grad.addColorStop(1, `rgba(168, 200, 232, 0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(waveX - thickness, boardY, thickness * 2, boardSize);
    } else {
      const grad = ctx.createLinearGradient(0, waveY - thickness, 0, waveY + thickness);
      grad.addColorStop(0, `rgba(168, 200, 232, 0)`);
      grad.addColorStop(0.5, `rgba(168, 200, 232, ${fade})`);
      grad.addColorStop(1, `rgba(168, 200, 232, 0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(boardX, waveY - thickness, boardSize, thickness * 2);
    }
    ctx.restore();
  }

  // ============================================================
  // ОТРИСОВКА СТЕН
  // ============================================================
  function drawWall(t, r, c, color, alpha) {
    if (alpha === undefined) alpha = 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (t === 'H') drawWallH(toViewWallR(r), toViewWallC(c), color);
    else drawWallV(toViewWallR(r), toViewWallC(c), color);
    ctx.restore();
  }
  function drawWallH(r, c, color) {
    const y = PAD + (r + 1) * CELL - WALL_THICK / 2;
    const x = PAD + c * CELL + CELL * 0.08;
    const w = CELL * 2 - CELL * 0.16;
    ctx.fillStyle = color;
    roundRect(x, y, w, WALL_THICK, WALL_THICK / 2); ctx.fill();
  }
  function drawWallV(r, c, color) {
    const x = PAD + (c + 1) * CELL - WALL_THICK / 2;
    const y = PAD + r * CELL + CELL * 0.08;
    const h = CELL * 2 - CELL * 0.16;
    ctx.fillStyle = color;
    roundRect(x, y, WALL_THICK, h, WALL_THICK / 2); ctx.fill();
  }

  function drawPiece(row, col, color, alpha) {
    if (alpha === undefined) alpha = 1;
    const x = PAD + toViewC(col) * CELL + CELL / 2;
    const y = PAD + toViewR(row) * CELL + CELL / 2;
    const rad = CELL * 0.32;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(x, y + 2, rad, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.arc(x - rad * 0.28, y - rad * 0.28, rad * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ============================================================
  // ГЛАВНАЯ ОТРИСОВКА
  // ============================================================
  function draw() {
    if (!state) return;
    const size = canvas.width / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, size, size);

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = PAD + toViewC(c) * CELL, y = PAD + toViewR(r) * CELL;
        ctx.fillStyle = (r + c) % 2 === 0 ? '#34373c' : '#2e3136';
        ctx.fillRect(x, y, CELL, CELL);
      }
    }

    if (gameMode === 'plates' && state.plates) {
      for (const [pr, pc] of state.plates) drawPlate(pr, pc);
    }
    if (gameMode === 'arrows' && state.arrows) {
      for (const a of state.arrows) drawArrowOutline(a);
    }
    if (gameMode === 'bushes' && state.bushes) {
      for (const b of state.bushes) drawBush(b.r, b.c);
    }
    if (gameMode === 'infinite_walls' && state.bubbles) {
      for (const b of state.bubbles) drawBubble(b);
    }

    // Точки-подсказки
    if (!isObserver && state.started && !state.gameOver && state.current === myPlayer && !dragState && !sending && !eventPlaying && !windPush) {
      const moves = getAvailableMoves(myPlayer);
      for (const [mr, mc] of moves) {
        if (gameMode === 'arrows' && arrowAt(mr, mc)) continue;
        const x = PAD + toViewC(mc) * CELL + CELL / 2;
        const y = PAD + toViewR(mr) * CELL + CELL / 2;
        // В fragile: если между нами и целевой клеткой стена — рисуем «удар»
        if (gameMode === 'fragile') {
          const from = myPlayer === 1 ? state.p1 : state.p2;
          const w = getWallBetween(from[0], from[1], mr, mc, myPlayer);
          if (w) {
            ctx.beginPath(); ctx.arc(x, y, CELL * 0.16, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 200, 120, 0.9)';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            continue;
          }
        }
        ctx.beginPath(); ctx.arc(x, y, CELL * 0.14, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fill();
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      const p = PAD + i * CELL;
      ctx.beginPath(); ctx.moveTo(PAD, p); ctx.lineTo(PAD + N * CELL, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, PAD); ctx.lineTo(p, PAD + N * CELL); ctx.stroke();
    }

    for (const k of state.walls) {
      const w = parseWallKey(k);
      const owner = w.player || 0;
      let col;
      if (owner === 1) col = COLOR_P1;
      else if (owner === 2) col = COLOR_P2;
      else col = '#79705f';

      let alpha = 1;
      if (gameMode === 'phantom') {
        // Свои — полупрозрачные, чужие — непрозрачные
        if (owner === myPlayer) alpha = 0.32;
        else alpha = 1;
      } else if (gameMode === 'fragile') {
        const hp = (state.wallHp && state.wallHp[k]) || WALL_HP_MAX;
        alpha = hp === WALL_HP_MAX ? 1 : (0.35 + 0.65 * (hp / WALL_HP_MAX));
      }

      drawWall(w.type, w.r, w.c, col, alpha);
    }

    if (gameMode === 'traps' && state.traps) {
      for (const t of state.traps) {
        if (t.triggered && !t.broken) drawTrapWalls(t);
      }
    }

    if (gameMode === 'movers' && state.movers) {
      for (const m of state.movers) {
        const pos = getMoverVisual(m);
        drawMoverH(pos.r, pos.c);
      }
    }

    if (!isObserver && dragState) drawPreviewWallAnim();

    for (let i = explosions.length - 1; i >= 0; i--) {
      if (!drawExplosion(explosions[i])) explosions.splice(i, 1);
    }
    for (let i = wallExplosions.length - 1; i >= 0; i--) {
      if (!drawWallExplosion(wallExplosions[i])) wallExplosions.splice(i, 1);
    }

    if (gameMode === 'wind') drawWindWave();

    const pos1 = getPiecePos('p1');
    const pos2 = getPiecePos('p2');

    const order = state.current === 1 ? [2, 1] : [1, 2];
    for (const who of order) {
      const alpha = getPieceAlpha(who);
      if (alpha <= 0) continue;
      const pos = who === 1 ? pos1 : pos2;
      const color = who === 1 ? COLOR_P1 : COLOR_P2;
      drawPiece(pos.r, pos.c, color, alpha);
    }

    if (!state.gameOver && !pieceAnim.p1 && !pieceAnim.p2 && !windPush && !eventPlaying && !isObserver) {
      if (state.current === myPlayer) {
        const pos = state.current === 1 ? pos1 : pos2;
        const activeAlpha = getPieceAlpha(state.current);
        if (activeAlpha > 0) {
          const x = PAD + toViewC(pos.c) * CELL + CELL / 2;
          const y = PAD + toViewR(pos.r) * CELL + CELL / 2;
          ctx.beginPath(); ctx.arc(x, y, CELL * 0.44, 0, Math.PI * 2);
          ctx.strokeStyle = state.current === 1 ? COLOR_P1 : COLOR_P2;
          ctx.lineWidth = 2; ctx.stroke();
        }
      }
    }
  }

  function drawPreviewWallAnim() {
    if (!dragState) return;
    const { animX, animY, preview, orient } = dragState;
    const pColor = myPlayer === 1 ? COLOR_P1 : COLOR_P2;
    ctx.save();
    ctx.globalAlpha = preview ? 0.22 : 0.38;
    ctx.fillStyle = pColor;
    ctx.translate(animX, animY);
    if (orient === 'h') roundRect(-CELL + CELL * 0.08, -WALL_THICK / 2, CELL * 2 - CELL * 0.16, WALL_THICK, WALL_THICK / 2);
    else roundRect(-WALL_THICK / 2, -CELL + CELL * 0.08, WALL_THICK, CELL * 2 - CELL * 0.16, WALL_THICK / 2);
    ctx.fill();
    ctx.restore();
    if (preview) {
      const cx = PAD + (preview.viewC + 1) * CELL;
      const cy = PAD + (preview.viewR + 1) * CELL;
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = pColor;
      ctx.translate(cx, cy);
      if (orient === 'h') roundRect(-CELL + CELL * 0.08, -WALL_THICK / 2, CELL * 2 - CELL * 0.16, WALL_THICK, WALL_THICK / 2);
      else roundRect(-WALL_THICK / 2, -CELL + CELL * 0.08, WALL_THICK, CELL * 2 - CELL * 0.16, WALL_THICK / 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ============================================================
  // ХОДЫ (клиентская копия)
  // ============================================================
  function getAvailableMoves(player) {
    if (!state || state.gameOver) return [];
    const from = player === 1 ? state.p1 : state.p2;
    const enemy = player === 1 ? state.p2 : state.p1;

    if (gameMode === 'traps' && cellLockedByTrap(from[0], from[1])) {
      const hits = [];
      for (const [dr, dc] of DIRS_ORTHO) {
        const mr = from[0] + dr, mc = from[1] + dc;
        if (mr < 0 || mr >= N || mc < 0 || mc >= N) continue;
        if (mr === enemy[0] && mc === enemy[1]) continue;
        hits.push([mr, mc]);
      }
      return hits;
    }

    const dirs = gameMode === 'free' ? DIRS_ORTHO.concat(DIRS_DIAG) : DIRS_ORTHO;
    const enemyTrapped = gameMode === 'traps' && cellLockedByTrap(enemy[0], enemy[1]);
    const moves = [];

    for (const [dr, dc] of dirs) {
      const mr = from[0] + dr, mc = from[1] + dc;
      if (mr < 0 || mr >= N || mc < 0 || mc >= N) continue;

      // FRAGILE: если между нами и целевой клеткой есть стена — это удар, а не ход
      if (gameMode === 'fragile') {
        const w = getWallBetween(from[0], from[1], mr, mc, player);
        if (w) {
          moves.push([mr, mc]);
          continue;
        }
      }

      if (isBlocked(from[0], from[1], mr, mc, player)) continue;
      if (gameMode === 'plates' && isPlate(mr, mc)) continue;
      if (gameMode === 'movers' && dc === 0 && dr !== 0) {
        const mrr = Math.min(from[0], mr);
        if (moverExists('H', mrr, from[1]) || moverExists('H', mrr, from[1] - 1)) continue;
      }

      if (mr === enemy[0] && mc === enemy[1]) {
        if (enemyTrapped) continue;
        const jr = mr + dr, jc = mc + dc;
        const jw = isBlocked(mr, mc, jr, jc, player);
        const jo = jr < 0 || jr >= N || jc < 0 || jc >= N;
        const jPlate = !jo && gameMode === 'plates' && isPlate(jr, jc);
        if (!jw && !jo && !jPlate) moves.push([jr, jc]);
        else {
          const sides = dr === 0 ? [[-1,0],[1,0]] : (dc === 0 ? [[0,-1],[0,1]] : []);
          for (const [sr, sc] of sides) {
            const dr2 = mr + sr, dc2 = mc + sc;
            if (dr2 < 0 || dr2 >= N || dc2 < 0 || dc2 >= N) continue;
            if (isBlocked(mr, mc, dr2, dc2, player)) continue;
            if (isBlocked(from[0], from[1], dr2, dc2, player)) continue;
            if (gameMode === 'plates' && isPlate(dr2, dc2)) continue;
            moves.push([dr2, dc2]);
          }
        }
        continue;
      }
      moves.push([mr, mc]);
    }
    const seen = new Set();
    return moves.filter(([r, c]) => { const k = r + ',' + c; if (seen.has(k)) return false; seen.add(k); return true; });
  }

  // ============================================================
  // АНИМАЦИИ (RAF)
  // ============================================================
  function hasActiveAnimations() {
    if (pieceAnim.p1 || pieceAnim.p2) return true;
    if (teleportAnim) return true;
    if (windPush) {
      const now = performance.now();
      if (now - windPush.start < windPush.duration) return true;
    }
    if (windWave) {
      const now = performance.now();
      if (now - windWave.start < WIND_WAVE_DURATION) return true;
    }
    if (moversPrev && state && state.movers) {
      // Проверяем есть ли отличия prev vs current
      const diff = state.movers.some(m => {
        const p = moversPrev.find(x => x.id === m.id);
        return p && (p.r !== m.r || p.c !== m.c);
      });
      if (diff && performance.now() - moversAnimStart < MOVER_DURATION) return true;
    }
    if (explosions.length || wallExplosions.length) return true;
    if (eventQueue.length || eventPlaying) return true;
    if (trapSpins.size) return true;
    return false;
  }

  function tickAnimations() {
    if (animRaf) return;
    animRaf = requestAnimationFrame(function step() {
      const now = performance.now();
      // Обнуляем завершённые
      if (windWave && now - windWave.start >= WIND_WAVE_DURATION) windWave = null;
      if (windPush && now - windPush.start >= windPush.duration) windPush = null;

      // Удаляем завершённые взрывы
      for (let i = explosions.length - 1; i >= 0; i--) {
        if (now - explosions[i].start >= explosions[i].duration) explosions.splice(i, 1);
      }
      for (let i = wallExplosions.length - 1; i >= 0; i--) {
        if (now - wallExplosions[i].start >= wallExplosions[i].duration) wallExplosions.splice(i, 1);
      }

      draw();
      if (hasActiveAnimations()) {
        animRaf = requestAnimationFrame(step);
      } else {
        animRaf = null;
        if (state) {
          visualP1 = [...state.p1];
          visualP2 = [...state.p2];
        }
        refresh();
      }
    });
  }

  function getPiecePos(who) {
    const playerNum = who === 'p1' ? 1 : 2;

    if (teleportAnim && teleportAnim.player === playerNum) {
      const now = performance.now();
      const t = Math.min(1, (now - teleportAnim.start) / teleportAnim.duration);
      const e = easeInOutQuad(t);
      return {
        r: teleportAnim.fromR + (teleportAnim.toR - teleportAnim.fromR) * e,
        c: teleportAnim.fromC + (teleportAnim.toC - teleportAnim.fromC) * e,
      };
    }

    if (windPush && gameMode === 'wind') {
      const elapsed = performance.now() - windPush.start;
      const f = who === 'p1' ? windPush.p1From : windPush.p2From;
      const to = who === 'p1' ? windPush.p1To : windPush.p2To;
      if (elapsed <= 0) return { r: f[0], c: f[1] };
      const t = Math.min(1, elapsed / windPush.duration);
      const e = easeInOutQuad(t);
      return {
        r: f[0] + (to[0] - f[0]) * e,
        c: f[1] + (to[1] - f[1]) * e,
      };
    }

    const a = pieceAnim[who];
    if (a) {
      const now = performance.now();
      const t = Math.min(1, (now - a.start) / a.duration);
      const e = easeOutQuad(t);
      return {
        r: a.fromR + (a.toR - a.fromR) * e,
        c: a.fromC + (a.toC - a.fromC) * e,
      };
    }

    const visual = who === 'p1' ? visualP1 : visualP2;
    return { r: visual[0], c: visual[1] };
  }

  function startPieceAnim(who, fromR, fromC, toR, toC, onDone) {
    pieceAnim[who] = { fromR, fromC, toR, toC, start: performance.now(), duration: MOVE_DURATION, onDone };
    tickAnimations();
  }
  function startTeleportAnim(player, fromR, fromC, toR, toC, onDone) {
    teleportAnim = { player, fromR, fromC, toR, toC, start: performance.now(), duration: TELEPORT_DURATION, onDone };
    tickAnimations();
  }

  // ============================================================
  // ПРОИГРЫВАНИЕ СОБЫТИЙ
  // ============================================================
  function playTurnEvents(events) {
    eventQueue.push(...events);
    if (!eventPlaying) playNextEvent();
  }

  function playNextEvent() {
    if (!eventQueue.length) {
      eventPlaying = false;
      windWave = null;
      windPush = null;
      if (state) {
        visualP1 = [...state.p1];
        visualP2 = [...state.p2];
      }
      refresh();
      return;
    }
    eventPlaying = true;
    const ev = eventQueue.shift();

    if (ev.type === 'move') {
      const who = ev.player === 1 ? 'p1' : 'p2';
      if (who === 'p1') visualP1 = [...ev.from];
      else visualP2 = [...ev.from];
      startPieceAnim(who, ev.from[0], ev.from[1], ev.to[0], ev.to[1], () => {
        if (who === 'p1') visualP1 = [...ev.to];
        else visualP2 = [...ev.to];
        setTimeout(playNextEvent, EVENT_GAP);
      });
    } else if (ev.type === 'teleport') {
      const cur = ev.player === 1 ? [...visualP1] : [...visualP2];
      startTeleportAnim(ev.player, cur[0], cur[1], ev.to[0], ev.to[1], () => {
        if (ev.player === 1) visualP1 = [...ev.to];
        else visualP2 = [...ev.to];
        setTimeout(playNextEvent, EVENT_GAP);
      });
    } else if (ev.type === 'bomb') {
      const cx = PAD + toViewC(ev.c) * CELL + CELL / 2;
      const cy = PAD + toViewR(ev.r) * CELL + CELL / 2;
      explosions.push({ cx, cy, start: performance.now(), duration: 700, maxRadius: CELL * 1.05 });
      if (ev.destroyed) {
        ev.destroyed.forEach((dk, j) => {
          const parts = dk.split(':');
          const t = parts[0], r = parseInt(parts[1]), c = parseInt(parts[2]);
          wallExplosions.push({ type: t, r, c, start: performance.now() + j * 30, duration: 380 });
        });
      }
      tickAnimations();
      setTimeout(playNextEvent, 700);
    } else if (ev.type === 'trap_trigger') {
      const key = `${ev.r}:${ev.c}`;
      trapSpins.set(key, performance.now());
      tickAnimations();
      setTimeout(playNextEvent, TRAP_SPIN_DURATION);
    } else if (ev.type === 'mover') {
      // Муверы обновляются единым блоком — здесь только пауза
      setTimeout(playNextEvent, MOVER_DURATION);
    } else if (ev.type === 'wind') {
      windWave = { dirR: ev.dirR, dirC: ev.dirC, start: performance.now() };
      visualP1 = [...ev.p1From];
      visualP2 = [...ev.p2From];
      windPush = {
        p1From: [...ev.p1From], p1To: [...ev.p1To],
        p2From: [...ev.p2From], p2To: [...ev.p2To],
        start: performance.now() + WIND_PUSH_DELAY,
        duration: WIND_PUSH_DURATION,
      };
      tickAnimations();
      setTimeout(() => {
        visualP1 = [...ev.p1To];
        visualP2 = [...ev.p2To];
        windWave = null;
        windPush = null;
        playNextEvent();
      }, WIND_PUSH_DELAY + WIND_PUSH_DURATION + 60);
    } else if (ev.type === 'hit') {
      setTimeout(playNextEvent, 200);
    } else if (ev.type === 'wall') {
      setTimeout(playNextEvent, 120);
    } else if (ev.type === 'bubble_collect' || ev.type === 'bubble_spawn') {
      setTimeout(playNextEvent, 120);
    } else {
      setTimeout(playNextEvent, 60);
    }
  }

  // ============================================================
  // REFRESH
  // ============================================================
  function refresh() {
    draw();
    if (!state) return;

    let topPlayer, bottomPlayer;
    if (isObserver) { topPlayer = 2; bottomPlayer = 1; }
    else { topPlayer = myPlayer === 1 ? 2 : 1; bottomPlayer = myPlayer; }

    const topMeta = playersMeta[topPlayer] || {};
    setAvatarDOM(enemyAvatar, topPlayer, topMeta);
    enemyName.textContent = topMeta.name || ('Игрок ' + topPlayer);
    enemyPanel.classList.remove('active-1', 'active-2');

    const topLeft = topPlayer === 1 ? state.left1 : state.left2;
    const topDots = enemyDotsEl.children;
    for (let i = 0; i < topDots.length; i++) topDots[i].className = 'dot' + (i < topLeft ? ' me-' + topPlayer : '');
    const topActive = !state.gameOver && state.current === topPlayer;
    enemyPanel.classList.toggle('active-' + topPlayer, topActive);
    enemyTurn.classList.toggle('show', topActive);
    enemyAvatar.classList.toggle('active', topActive);

    if (gameMode === 'bombs') {
      const enemyBombCount = topPlayer === 1 ? state.bombs1 : state.bombs2;
      const enemyBombDots = enemyBombsEl.children;
      for (let i = 0; i < enemyBombDots.length; i++) {
        enemyBombDots[i].className = 'dot ' + (i < enemyBombCount ? 'bomb' : 'bomb empty');
      }
    }

    const botMeta = playersMeta[bottomPlayer] || {};
    setAvatarDOM(myAvatar, bottomPlayer, botMeta);
    myName.textContent = botMeta.name || ('Игрок ' + bottomPlayer);
    myPanel.classList.remove('active-1', 'active-2');
    myDrags.querySelectorAll('.drag-item').forEach(item => { item.classList.remove('me-1', 'me-2'); item.classList.add('me-' + bottomPlayer); });

    const botLeft = bottomPlayer === 1 ? state.left1 : state.left2;
    const botDots = myDotsEl.children;
    for (let i = 0; i < botDots.length; i++) botDots[i].className = 'dot' + (i < botLeft ? ' me-' + bottomPlayer : '');
    const botActive = !state.gameOver && state.current === bottomPlayer;
    myPanel.classList.toggle('active-' + bottomPlayer, botActive);
    myTurn.classList.toggle('show', botActive);
    myAvatar.classList.toggle('active', botActive);

    if (gameMode === 'bombs') {
      const myBombCount = bottomPlayer === 1 ? state.bombs1 : state.bombs2;
      const myBombDots = myBombsEl.children;
      for (let i = 0; i < myBombDots.length; i++) {
        myBombDots[i].className = 'dot ' + (i < myBombCount ? 'bomb' : 'bomb empty');
      }
      bombCnt.textContent = myBombCount;
      btnBomb.disabled = myBombCount <= 0 || state.gameOver || state.current !== myPlayer || sending;
      btnBomb.classList.toggle('hidden', isObserver);
    }

    if (isObserver) {
      myDrags.style.display = 'none';
      btnSurrender.classList.add('hidden');
      btnBomb.classList.add('hidden');
    } else {
      myDrags.style.display = '';
      const myTurnActive = !state.gameOver && state.current === myPlayer;
      myDrags.querySelectorAll('.drag-item').forEach(item => {
        item.classList.toggle('disabled', !myTurnActive || botLeft <= 0 || sending);
      });
      if (state.started && !state.gameOver) btnSurrender.classList.remove('hidden');
      else btnSurrender.classList.add('hidden');
      if (gameMode === 'bombs') btnBomb.classList.remove('hidden');
    }

    updateObserversBadge();
  }

  function applyState(s) {
    const prev = state;
    state = s;
    if (s.players) playersMeta = s.players;
    if (s.observers) observersList = s.observers;
    wallOwnerMap = rebuildWallOwners();

    if (!prev) {
      visualP1 = [...s.p1];
      visualP2 = [...s.p2];
      // Первая инициализация муверов
      if (s.movers) {
        moversPrev = s.movers.map(m => ({ id: m.id, r: m.r, c: m.c }));
      }
    } else {
      // Муверы: если позиции изменились — запускаем интерполяцию
      if (s.movers) {
        if (!moversPrev) {
          moversPrev = s.movers.map(m => ({ id: m.id, r: m.r, c: m.c }));
        } else {
          const changed = s.movers.some(m => {
            const p = moversPrev.find(x => x.id === m.id);
            return p && (p.r !== m.r || p.c !== m.c);
          });
          if (changed) {
            moversAnimStart = performance.now();
            // Стартуем анимацию; после завершения prev = current
            setTimeout(() => {
              if (state && state.movers) {
                moversPrev = state.movers.map(m => ({ id: m.id, r: m.r, c: m.c }));
              }
              tickAnimations();
            }, MOVER_DURATION);
            tickAnimations();
          } else {
            // Синхронизируем prev
            moversPrev = s.movers.map(m => ({ id: m.id, r: m.r, c: m.c }));
          }
        }
      }
    }

    const newTurnIndex = s.turnIndex || 0;
    const events = s.lastTurnEvents || [];
    if (newTurnIndex > lastAnimatedTurnIndex && events.length) {
      lastAnimatedTurnIndex = newTurnIndex;
      playTurnEvents(events);
    } else if (newTurnIndex > lastAnimatedTurnIndex) {
      lastAnimatedTurnIndex = newTurnIndex;
      if (!eventPlaying && eventQueue.length === 0) {
        visualP1 = [...s.p1];
        visualP2 = [...s.p2];
      }
    }
  }

  function rebuildWallOwners() {
    const map = new Map();
    if (!state) return map;
    for (const k of state.walls) {
      const w = parseWallKey(k);
      if (w.player === 1 || w.player === 2) map.set(`${w.type}:${w.r}:${w.c}`, w.player);
    }
    return map;
  }

  function handleGameOver(winner, replayId) {
    if (lastGameOverShown) return;
    lastGameOverShown = true;
    stopPolling();
    showWinScreen(winner, replayId);
  }

  async function fetchState() {
    if (!roomCode) return;
    if (lastGameOverShown) return;
    try {
      const s = await api(`/api/state/${roomCode}`);
      applyState(s);
      refresh();
      if (s.started && screens.waiting.classList.contains('active')) {
        resizeCanvas(); refresh(); showScreen('game');
      }
      if (s.gameOver && s.winner) handleGameOver(s.winner, s.replayId);
    } catch (e) {
      if (lastGameOverShown) return;
      if (e.status === 404) {
        stopPolling();
        showError('Комната недоступна', 'Возможно, игра уже завершена.');
        return;
      }
      stopPolling();
      showDialog({
        title: 'Соединение потеряно',
        text: 'Возможно, комната закрыта.',
        buttons: [{ label: 'ОК', primary: true, onClick: () => { if (tg) { try { tg.close(); } catch (err) {} } } }]
      });
    }
  }
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(fetchState, POLL_INTERVAL);
    fetchState();
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function showWinScreen(winner, replayId) {
    const loser = winner === 1 ? 2 : 1;
    const wmeta = playersMeta[winner] || {};
    const lmeta = playersMeta[loser] || {};

    if (wmeta.photo) winnerAvatarEl.innerHTML = `<img src="${wmeta.photo}" alt="" referrerpolicy="no-referrer">`;
    else winnerAvatarEl.textContent = (wmeta.name || 'И').charAt(0).toUpperCase();
    winnerAvatarEl.classList.toggle('is-p2', winner === 2);

    if (lmeta.photo) loserAvatarEl.innerHTML = `<img src="${lmeta.photo}" alt="" referrerpolicy="no-referrer">`;
    else loserAvatarEl.textContent = (lmeta.name || 'П').charAt(0).toUpperCase();

    winnerNameEl.textContent = wmeta.name || ('Игрок ' + winner);
    loserNameEl.textContent = lmeta.name || ('Игрок ' + loser);

    winScreen.classList.add('show');

    btnWinClose.onclick = () => {
