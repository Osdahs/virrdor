<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Virrdor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  :root {
    --bg: #1e1f22;
    --panel: #27292d;
    --panel-edge: #33363b;
    --text: #dcdad6;
    --text-dim: #86898f;
    --p1: #c96b5c;
    --p2: #6b90b8;
    --p1-soft: #3a2b28;
    --p2-soft: #2a3340;
    --danger: #d9534f;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    color: var(--text);
    touch-action: none;
    overscroll-behavior: none;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  .centered {
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
  }
  .spinner-big {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.12);
    border-top-color: var(--p1);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .centered .msg {
    font-size: 15px;
    color: var(--text-dim);
    max-width: 300px;
    line-height: 1.5;
  }
  .centered .title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
  }
  .room-code-badge {
    margin-top: 22px;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    padding: 10px 24px 10px 32px;
    border-radius: 16px;
    background: #27292d;
    box-shadow: inset 0 0 0 1.5px var(--panel-edge);
  }

  .game { display: flex; flex-direction: column; }

  .board-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 10px; position: relative; min-height: 0; background: var(--bg);
  }
  .board-wrap { position: relative; touch-action: none; }
  canvas { display: block; border-radius: 14px; background: #2a2d32; }

  .panel {
    flex: 0 0 auto;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    padding: 8px 10px;
    gap: 8px;
    position: relative;
    z-index: 5;
    transition: background .3s;
  }
  .enemy-panel { border-bottom: 1px solid var(--panel-edge); }
  .my-panel { border-top: 1px solid var(--panel-edge); }

  .enemy-panel.active-1, .my-panel.active-1 { background: #2b2927; }
  .enemy-panel.active-2, .my-panel.active-2 { background: #262a30; }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
  }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #1e1f22;
    transition: transform .25s;
    overflow: hidden;
    position: relative;
  }
  .avatar.me-1 { background: var(--p1); }
  .avatar.me-2 { background: var(--p2); }
  .avatar.active { transform: scale(1.08); }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .panel-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .panel-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panel-turn {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    opacity: 0; transition: opacity .2s;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .panel-turn.show { opacity: 1; }
  .enemy-panel.active-1 .panel-turn,
  .my-panel.active-1 .panel-turn { color: var(--p1); }
  .enemy-panel.active-2 .panel-turn,
  .my-panel.active-2 .panel-turn { color: var(--p2); }

  .leave-btn {
    width: 34px; height: 34px; border-radius: 10px;
    background: transparent; border: none; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .2s, color .2s; flex-shrink: 0;
  }
  .leave-btn:hover { background: #33363b; color: var(--danger); }
  .leave-btn:active { transform: scale(0.94); }

  .dots-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px 6px;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #3a3d43;
    justify-self: center;
    transition: background .25s;
  }
  .dot.me-1 { background: var(--p1); }
  .dot.me-2 { background: var(--p2); }

  .draggables { display: flex; gap: 8px; margin-top: 2px; }
  .drag-item {
    flex: 1; height: 54px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: grab; touch-action: none;
    position: relative;
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s;
  }
  .drag-item:active {
    transform: scale(0.92);
    opacity: 0.7;
  }
  .drag-item.me-1 {
    background: var(--p1-soft);
    box-shadow: inset 0 0 0 1.5px rgba(201,107,92,0.4);
  }
  .drag-item.me-1 .icon { background: var(--p1); }
  .drag-item.me-2 {
    background: var(--p2-soft);
    box-shadow: inset 0 0 0 1.5px rgba(107,144,184,0.4);
  }
  .drag-item.me-2 .icon { background: var(--p2); }
  .drag-item.disabled { opacity: 0.25; pointer-events: none; }
  .drag-item .icon {
    width: 60px; height: 7px; border-radius: 4px;
  }
  .drag-item.vertical .icon { width: 7px; height: 60px; }

  .drag-item .sending-overlay {
    position: absolute; inset: 0;
    border-radius: 14px;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .drag-item.sending .sending-overlay {
    display: flex;
    animation: sendingPulse 0.7s ease-in-out infinite alternate;
  }
  @keyframes sendingPulse {
    from { background: rgba(0,0,0,0.15); }
    to   { background: rgba(0,0,0,0.45); }
  }
  .drag-item .sending-overlay .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .my-panel.sending {
    animation: panelFlash 0.6s ease-in-out infinite alternate;
  }
  @keyframes panelFlash {
    from { background: var(--panel); }
    to   { background: #303339; }
  }

  .status {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    background: #27292d; padding: 14px 28px; border-radius: 16px;
    font-size: 17px; font-weight: 700; color: var(--text);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .25s, transform .25s;
    white-space: nowrap; z-index: 10;
  }
  .status.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .status.win { color: #e8c96a; }

  .dialog-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 200; padding: 20px;
  }
  .dialog-backdrop.show { opacity: 1; pointer-events: auto; }
  .dialog {
    background: var(--panel); border-radius: 20px; padding: 26px 24px;
    width: 100%; max-width: 320px;
    transform: scale(0.92); transition: transform .25s;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align: center;
  }
  .dialog-backdrop.show .dialog { transform: scale(1); }
  .dialog-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .dialog-text { font-size: 14px; color: var(--text-dim); line-height: 1.45; margin-bottom: 20px; }
  .dialog-actions { display: flex; gap: 10px; }
  .btn {
    border: none; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 14px 18px; border-radius: 12px; cursor: pointer;
    transition: transform .1s, background .2s;
    letter-spacing: 0.3px; color: var(--text); flex: 1;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--p1); color: #1e1f22; }
  .btn-primary:hover { background: #d67b6c; }
  .btn-secondary {
    background: transparent; color: var(--text);
    box-shadow: inset 0 0 0 1.5px var(--panel-edge);
  }
  .btn-danger { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<div class="screen centered active" id="screen-loading">
  <div class="spinner-big"></div>
  <div class="msg" id="loadingMsg">Подключение к игре…</div>
</div>

<div class="screen centered" id="screen-waiting">
  <div class="spinner-big"></div>
  <div class="title" id="waitingTitle">Ожидание соперника</div>
  <div class="msg" id="waitingMsg">
    Отправьте другу сообщение из бота с кнопкой.<br>
    Игра начнётся автоматически.
  </div>
  <div class="room-code-badge" id="waitingCode">0000</div>
</div>

<div class="screen centered" id="screen-error">
  <div class="title" id="errorTitle">Не удалось войти</div>
  <div class="msg" id="errorMsg">Откройте игру через ссылку из бота.</div>
</div>

<div class="screen game" id="screen-game">

  <div class="panel enemy-panel" id="enemyPanel">
    <div class="panel-head">
      <div class="avatar" id="enemyAvatar">2</div>
      <div class="panel-info">
        <div class="panel-name" id="enemyName">Ожидание…</div>
        <div class="panel-turn" id="enemyTurn">● ходит</div>
      </div>
      <div class="dots-row" id="enemyDots"></div>
      <button class="leave-btn" id="btnLeaveGame" title="Выйти">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="board-area">
    <div class="board-wrap">
      <canvas id="board"></canvas>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="my-panel" id="myPanel">
    <div class="panel-head">
      <div class="avatar" id="myAvatar">1</div>
      <div class="panel-info">
        <div class="panel-name" id="myName">Вы</div>
        <div class="panel-turn" id="myTurn">● ходит</div>
      </div>
      <div class="dots-row" id="myDots"></div>
    </div>
    <div class="draggables" id="myDrags">
      <div class="drag-item" data-orient="h">
        <div class="icon"></div>
        <div class="sending-overlay"><div class="spinner"></div></div>
      </div>
      <div class="drag-item vertical" data-orient="v">
        <div class="icon"></div>
        <div class="sending-overlay"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="dialog">
  <div class="dialog">
    <div class="dialog-title" id="dialogTitle">Заголовок</div>
    <div class="dialog-text" id="dialogText">Текст</div>
    <div class="dialog-actions" id="dialogActions"></div>
  </div>
</div>

<script>
(function(){
  const API_BASE = 'https://api.vidokl.xyz';

  const N = 9;
  const WALLS_PER_PLAYER = 10;
  const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
  const COLOR_P1 = '#c96b5c';
  const COLOR_P2 = '#6b90b8';
  const COLOR_INVALID = '#b0423a';
  const POLL_INTERVAL = 700;

  const MOVE_DURATION = 180;
  const FINGER_OFFSET_Y = 40;
  const LERP_FACTOR = 0.35;

  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
  function lerp(a, b, f) { return a + (b - a) * f; }

  let myPlayer = null;
  let roomCode = null;
  let state = null;
  let pollTimer = null;
  let dragState = null;
  let pieceAnim = { p1: null, p2: null };
  let animRaf = null;
  let sending = false;
  let myUser = null;
  let playersMeta = {};

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor('#1e1f22');
      tg.setBackgroundColor('#1e1f22');
    } catch (e) {}
  }

  function toViewR(r) { return myPlayer === 1 ? r : N - 1 - r; }
  function toViewC(c) { return myPlayer === 1 ? c : N - 1 - c; }
  function fromViewR(r) { return myPlayer === 1 ? r : N - 1 - r; }
  function fromViewC(c) { return myPlayer === 1 ? c : N - 1 - c; }

  const screens = {
    loading: document.getElementById('screen-loading'),
    waiting: document.getElementById('screen-waiting'),
    error: document.getElementById('screen-error'),
    game: document.getElementById('screen-game'),
  };
  const loadingMsg = document.getElementById('loadingMsg');
  const errorTitle = document.getElementById('errorTitle');
  const errorMsg = document.getElementById('errorMsg');
  const waitingCode = document.getElementById('waitingCode');
  const waitingMsg = document.getElementById('waitingMsg');
  const waitingTitle = document.getElementById('waitingTitle');

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');

  const myAvatar = document.getElementById('myAvatar');
  const myPanel = document.getElementById('myPanel');
  const myTurn = document.getElementById('myTurn');
  const myDotsEl = document.getElementById('myDots');
  const myName = document.getElementById('myName');
  const myDrags = document.getElementById('myDrags');

  const enemyPanel = document.getElementById('enemyPanel');
  const enemyAvatar = document.getElementById('enemyAvatar');
  const enemyName = document.getElementById('enemyName');
  const enemyTurn = document.getElementById('enemyTurn');
  const enemyDotsEl = document.getElementById('enemyDots');

  const btnLeaveGame = document.getElementById('btnLeaveGame');

  const dialog = document.getElementById('dialog');
  const dialogTitle = document.getElementById('dialogTitle');
  const dialogText = document.getElementById('dialogText');
  const dialogActions = document.getElementById('dialogActions');

  let CELL = 0, PAD = 0, WALL_THICK = 0;
  function resizeCanvas() {
    const area = document.querySelector('.board-area');
    const rect = area.getBoundingClientRect();
    const size = Math.min(rect.width - 20, rect.height - 20);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    PAD = size * 0.04;
    CELL = (size - PAD * 2) / N;
    WALL_THICK = Math.max(4, CELL * 0.14);
  }

  async function api(path, opts = {}) {
    const res = await fetch(API_BASE + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    if (!res.ok) {
      let err = {};
      try { err = await res.json(); } catch (e) {}
      const e = new Error(err.error || ('HTTP ' + res.status));
      e.status = res.status;
      throw e;
    }
    return res.json();
  }

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }
  function showError(title, msg) {
    errorTitle.textContent = title;
    errorMsg.textContent = msg;
    showScreen('error');
  }

  function showDialog(options) {
    dialogTitle.textContent = options.title || '';
    dialogText.textContent = options.text || '';
    dialogActions.innerHTML = '';
    const buttons = options.buttons || [{ label: 'ОК', primary: true }];
    buttons.forEach(btnOpt => {
      const b = document.createElement('button');
      b.className = 'btn ' + (btnOpt.danger ? 'btn-danger' : (btnOpt.primary ? 'btn-primary' : 'btn-secondary'));
      b.textContent = btnOpt.label;
      b.addEventListener('click', () => {
        const close = btnOpt.closeAfter !== false;
        if (close) hideDialog();
        if (btnOpt.onClick) btnOpt.onClick();
      });
      dialogActions.appendChild(b);
    });
    dialog.classList.add('show');
  }
  function hideDialog() { dialog.classList.remove('show'); }

  // ============ Логика игры ============
  function parseWall(k) {
    const parts = k.split(':');
    return {
      type: parts[0],
      r: +parts[1],
      c: +parts[2],
      player: parts.length > 3 ? +parts[3] : null,
    };
  }
  function wallMatches(k, t, r, c) {
    const w = parseWall(k);
    return w.type === t && w.r === r && w.c === c;
  }
  function hasWall(t, r, c) {
    if (!state) return false;
    return state.walls.some(k => wallMatches(k, t, r, c));
  }
  function isBlocked(r1, c1, r2, c2) {
    if (r1 === r2) {
      const mc = Math.min(c1, c2);
      if (hasWall('V', r1, mc)) return true;
      if (hasWall('V', r1 - 1, mc)) return true;
    }
    if (c1 === c2) {
      const mr = Math.min(r1, r2);
      if (hasWall('H', mr, c1)) return true;
      if (hasWall('H', mr, c1 - 1)) return true;
    }
    return false;
  }

  function getAvailableMoves(player) {
    if (!state || state.gameOver) return [];
    const from = player === 1 ? state.p1 : state.p2;
    const enemy = player === 1 ? state.p2 : state.p1;
    const moves = [];
    for (const [dr, dc] of DIRS) {
      const mr = from[0] + dr, mc = from[1] + dc;
      if (mr < 0 || mr >= N || mc < 0 || mc >= N) continue;
      if (isBlocked(from[0], from[1], mr, mc)) continue;
      if (mr === enemy[0] && mc === enemy[1]) {
        const jr = mr + dr, jc = mc + dc;
        const jw = isBlocked(mr, mc, jr, jc);
        const jo = jr < 0 || jr >= N || jc < 0 || jc >= N;
        if (!jw && !jo) {
          moves.push([jr, jc]);
        } else {
          const sides = dr === 0 ? [[-1,0],[1,0]] : [[0,-1],[0,1]];
          for (const [sr, sc] of sides) {
            const dr2 = mr + sr, dc2 = mc + sc;
            if (dr2 < 0 || dr2 >= N || dc2 < 0 || dc2 >= N) continue;
            if (isBlocked(mr, mc, dr2, dc2)) continue;
            if (isBlocked(from[0], from[1], dr2, dc2)) continue;
            moves.push([dr2, dc2]);
          }
        }
        continue;
      }
      moves.push([mr, mc]);
    }
    const seen = new Set();
    return moves.filter(([r, c]) => {
      const k = r + ',' + c;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function canPlaceHClient(r, c) {
    if (r < 0 || r >= N - 1 || c < 0 || c >= N - 1) return false;
    for (let dc = -1; dc <= 1; dc++) {
      const nc = c + dc;
      if (nc < 0 || nc >= N - 1) continue;
      if (hasWall('H', r, nc)) return false;
    }
    if (hasWall('V', r, c)) return false;
    if (hasWall('V', r, c + 1)) return false;
    return true;
  }
  function canPlaceVClient(r, c) {
    if (r < 0 || r >= N - 1 || c < 0 || c >= N - 1) return false;
    for (let dr = -1; dr <= 1; dr++) {
      const nr = r + dr;
      if (nr < 0 || nr >= N - 1) continue;
      if (hasWall('V', nr, c)) return false;
    }
    if (hasWall('H', r, c)) return false;
    if (hasWall('H', r + 1, c)) return false;
    return true;
  }

  function startPieceAnim(who, fromR, fromC, toR, toC) {
    if (fromR === toR && fromC === toC) return;
    pieceAnim[who] = {
      fromR, fromC, toR, toC,
      start: performance.now(),
      duration: MOVE_DURATION,
    };
    if (!animRaf) tickPieceAnim();
  }
  function tickPieceAnim() {
    animRaf = requestAnimationFrame(() => {
      const now = performance.now();
      let active = false;
      for (const who of ['p1', 'p2']) {
        const a = pieceAnim[who];
        if (!a) continue;
        if (now - a.start >= a.duration) pieceAnim[who] = null;
        else active = true;
      }
      draw();
      if (active) tickPieceAnim();
      else { animRaf = null; draw(); }
    });
  }
  function getPiecePos(who) {
    const a = pieceAnim[who];
    const pos = who === 'p1' ? state.p1 : state.p2;
    if (!a) return { r: pos[0], c: pos[1] };
    const t = Math.min(1, (performance.now() - a.start) / a.duration);
    const e = easeOutQuad(t);
    return {
      r: a.fromR + (a.toR - a.fromR) * e,
      c: a.fromC + (a.toC - a.fromC) * e,
    };
  }

  // ============ Отрисовка ============
  function draw() {
    if (!state) return;
    const size = canvas.width / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, size, size);

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const vr = toViewR(r), vc = toViewC(c);
        const x = PAD + vc * CELL;
        const y = PAD + vr * CELL;
        ctx.fillStyle = (r + c) % 2 === 0 ? '#34373c' : '#2e3136';
        ctx.fillRect(x, y, CELL, CELL);
      }
    }

    if (!state.gameOver && state.current === myPlayer && !dragState && !sending) {
      const moves = getAvailableMoves(myPlayer);
      for (const [mr, mc] of moves) {
        const vr = toViewR(mr), vc = toViewC(mc);
        const cx = PAD + vc * CELL + CELL / 2;
        const cy = PAD + vr * CELL + CELL / 2;
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * 0.14, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fill();
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      const p = PAD + i * CELL;
      ctx.beginPath(); ctx.moveTo(PAD, p); ctx.lineTo(PAD + N * CELL, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, PAD); ctx.lineTo(p, PAD + N * CELL); ctx.stroke();
    }

    for (const k of state.walls) {
      const w = parseWall(k);
      const col = w.player === 1 ? COLOR_P1 : (w.player === 2 ? COLOR_P2 : '#79705f');
      drawWallServer(w.type, w.r, w.c, col);
    }

    if (dragState) drawPreviewWallAnim();

    const p1Pos = getPiecePos('p1');
    const p2Pos = getPiecePos('p2');
    drawPiece(p1Pos.r, p1Pos.c, COLOR_P1);
    drawPiece(p2Pos.r, p2Pos.c, COLOR_P2);

    if (!state.gameOver && state.current === myPlayer) {
      const pos = myPlayer === 1 ? p1Pos : p2Pos;
      const vr = toViewR(pos.r), vc = toViewC(pos.c);
      const x = PAD + vc * CELL + CELL / 2;
      const y = PAD + vr * CELL + CELL / 2;
      ctx.beginPath();
      ctx.arc(x, y, CELL * 0.44, 0, Math.PI * 2);
      ctx.strokeStyle = myPlayer === 1 ? COLOR_P1 : COLOR_P2;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // Предпросмотр: силуэт летит за пальцем + запомненная валидная позиция
  function drawPreviewWallAnim() {
    if (!dragState) return;
    const { animX, animY, preview, orient } = dragState;

    // 1. Призрак, следующий за пальцем (полупрозрачный, не привязан к сетке)
    ctx.save();
    ctx.translate(animX, animY);
    ctx.globalAlpha = preview ? 0.22 : 0.38;
    ctx.fillStyle = myPlayer === 1 ? COLOR_P1 : COLOR_P2;
    if (orient === 'h') {
      roundRect(-CELL + CELL * 0.08, -WALL_THICK / 2, CELL * 2 - CELL * 0.16, WALL_THICK, WALL_THICK / 2);
    } else {
      roundRect(-WALL_THICK / 2, -CELL + CELL * 0.08, WALL_THICK, CELL * 2 - CELL * 0.16, WALL_THICK / 2);
    }
    ctx.fill();
    ctx.restore();

    // 2. Запомненная валидная позиция — рисуется по сетке, ярко
    if (preview) {
      const vr = preview.viewR;
      const vc = preview.viewC;
      const cx = PAD + (vc + 1) * CELL;
      const cy = PAD + (vr + 1) * CELL;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.shadowColor = myPlayer === 1 ? COLOR_P1 : COLOR_P2;
      ctx.shadowBlur = 14;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = myPlayer === 1 ? COLOR_P1 : COLOR_P2;
      if (orient === 'h') {
        roundRect(-CELL + CELL * 0.08, -WALL_THICK / 2, CELL * 2 - CELL * 0.16, WALL_THICK, WALL_THICK / 2);
      } else {
        roundRect(-WALL_THICK / 2, -CELL + CELL * 0.08, WALL_THICK, CELL * 2 - CELL * 0.16, WALL_THICK / 2);
      }
      ctx.fill();
      ctx.restore();
    }
  }

  function drawWallServer(t, r, c, color) {
    let vr, vc;
    if (myPlayer === 1) { vr = r; vc = c; }
    else { vr = N - 2 - r; vc = N - 2 - c; }
    if (t.toUpperCase() === 'H') drawWallH(vr, vc, color);
    else drawWallV(vr, vc, color);
  }
  function drawWallH(r, c, color) {
    const y = PAD + (r + 1) * CELL - WALL_THICK / 2;
    const x = PAD + c * CELL + CELL * 0.08;
    const w = CELL * 2 - CELL * 0.16;
    ctx.fillStyle = color;
    roundRect(x, y, w, WALL_THICK, WALL_THICK / 2);
    ctx.fill();
  }
  function drawWallV(r, c, color) {
    const x = PAD + (c + 1) * CELL - WALL_THICK / 2;
    const y = PAD + r * CELL + CELL * 0.08;
    const h = CELL * 2 - CELL * 0.16;
    ctx.fillStyle = color;
    roundRect(x, y, WALL_THICK, h, WALL_THICK / 2);
    ctx.fill();
  }

  function drawPiece(row, col, color) {
    const vr = toViewR(row), vc = toViewC(col);
    const x = PAD + vc * CELL + CELL / 2;
    const y = PAD + vr * CELL + CELL / 2;
    const rad = CELL * 0.32;

    ctx.beginPath();
    ctx.arc(x, y + 2, rad, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x - rad * 0.28, y - rad * 0.28, rad * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function buildDots(container) {
    container.innerHTML = '';
    for (let i = 0; i < WALLS_PER_PLAYER; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      container.appendChild(d);
    }
  }

  function setAvatarDOM(el, playerNum, meta) {
    el.classList.remove('me-1', 'me-2', 'active');
    el.classList.add('me-' + playerNum);
    if (meta && meta.photo) {
      el.innerHTML = `<img src="${meta.photo}" alt="" referrerpolicy="no-referrer">`;
    } else if (meta && meta.name) {
      el.textContent = meta.name.charAt(0).toUpperCase();
    } else {
      el.textContent = playerNum;
    }
  }

  function refresh() {
    draw();
    if (!state) return;

    const enemyPlayer = myPlayer === 1 ? 2 : 1;

    setAvatarDOM(myAvatar, myPlayer, playersMeta[myPlayer]);
    myName.textContent = (playersMeta[myPlayer] && playersMeta[myPlayer].name) || ('Игрок ' + myPlayer);
    myPanel.classList.remove('active-1', 'active-2');

    myDrags.querySelectorAll('.drag-item').forEach(item => {
      item.classList.remove('me-1', 'me-2');
      item.classList.add('me-' + myPlayer);
    });

    const myLeft = myPlayer === 1 ? state.left1 : state.left2;
    const myDots = myDotsEl.children;
    for (let i = 0; i < myDots.length; i++) {
      myDots[i].className = 'dot' + (i < myLeft ? ' me-' + myPlayer : '');
    }

    setAvatarDOM(enemyAvatar, enemyPlayer, playersMeta[enemyPlayer]);
    enemyName.textContent = (playersMeta[enemyPlayer] && playersMeta[enemyPlayer].name) || 'Ожидание…';
    enemyPanel.classList.remove('active-1', 'active-2');

    const enemyLeft = enemyPlayer === 1 ? state.left1 : state.left2;
    const enemyDots = enemyDotsEl.children;
    for (let i = 0; i < enemyDots.length; i++) {
      enemyDots[i].className = 'dot' + (i < enemyLeft ? ' me-' + enemyPlayer : '');
    }

    const myTurnActive = !state.gameOver && state.current === myPlayer;
    const enemyTurnActive = !state.gameOver && state.current === enemyPlayer;

    myPanel.classList.toggle('active-' + myPlayer, myTurnActive);
    myTurn.classList.toggle('show', myTurnActive);
    myAvatar.classList.toggle('active', myTurnActive);

    enemyPanel.classList.toggle('active-' + enemyPlayer, enemyTurnActive);
    enemyTurn.classList.toggle('show', enemyTurnActive);
    enemyAvatar.classList.toggle('active', enemyTurnActive);

    myDrags.querySelectorAll('.drag-item').forEach(item => {
      item.classList.toggle('disabled', !myTurnActive || myLeft <= 0 || sending);
    });

    if (state.gameOver && state.winner) {
      const winName = (playersMeta[state.winner] && playersMeta[state.winner].name) || ('Игрок ' + state.winner);
      statusEl.textContent = winName + ' победил';
      statusEl.className = 'status show win';
    } else {
      statusEl.classList.remove('show');
    }
  }

  function applyState(s) {
    if (state) {
      if (s.p1[0] !== state.p1[0] || s.p1[1] !== state.p1[1]) {
        startPieceAnim('p1', state.p1[0], state.p1[1], s.p1[0], s.p1[1]);
      }
      if (s.p2[0] !== state.p2[0] || s.p2[1] !== state.p2[1]) {
        startPieceAnim('p2', state.p2[0], state.p2[1], s.p2[0], s.p2[1]);
      }
    } else {
      pieceAnim.p1 = null;
      pieceAnim.p2 = null;
    }
    state = s;
    if (s.players) playersMeta = s.players;
  }

  // ============ Polling ============
  async function fetchState() {
    if (!roomCode) return;
    try {
      const s = await api(`/api/state/${roomCode}`);
      applyState(s);
      refresh();

      if (s.started && screens.waiting.classList.contains('active')) {
        resizeCanvas();
        refresh();
        showScreen('game');
      }
    } catch (e) {
      stopPolling();
      showDialog({
        title: 'Соединение потеряно',
        text: 'Не удалось получить состояние игры. Возможно, комната закрыта.',
        buttons: [{ label: 'ОК', primary: true, onClick: leaveSilently }]
      });
    }
  }
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(fetchState, POLL_INTERVAL);
    fetchState();
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ============ Вход ============
  async function bootstrap() {
    if (!tg || !tg.initData) {
      showError('Откройте в Telegram',
        'Эта игра работает только внутри Telegram Mini App. Откройте её через кнопку в сообщении бота.');
      return;
    }

    const startParam = tg.initDataUnsafe?.start_param || '';
    if (!startParam) {
      showError('Нет кода комнаты',
        'Ссылка не содержит код комнаты. Откройте игру из сообщения бота.');
      return;
    }

    loadingMsg.textContent = 'Авторизация…';
    roomCode = startParam;

    try {
      const res = await api('/api/validate', {
        method: 'POST',
        body: JSON.stringify({
          initData: tg.initData,
          room: roomCode,
        }),
      });

      myPlayer = res.player;
      myUser = res.user;

      if (!myPlayer) {
        showError('Комната заполнена', 'В этой комнате уже играют двое.');
        return;
      }

      const s = await api(`/api/state/${roomCode}`);
      applyState(s);

      resizeCanvas();

      if (s.started) {
        refresh();
        showScreen('game');
        startPolling();
      } else {
        waitingCode.textContent = roomCode;
        if (myPlayer === 1) {
          waitingTitle.textContent = 'Ожидание соперника';
          waitingMsg.innerHTML =
            'Отправьте другу сообщение из бота с кнопкой.<br>Игра начнётся автоматически.';
        } else {
          waitingTitle.textContent = 'Ожидание';
          waitingMsg.innerHTML = 'Ждём соперника…';
        }
        showScreen('waiting');
        startPolling();
      }
    } catch (e) {
      if (e.status === 404) {
        showError('Комната не найдена',
          'Возможно, сообщение с игрой устарело. Отправьте новое.');
      } else if (e.status === 409) {
        showError('Комната заполнена',
          'В этой комнате уже играют двое.');
      } else if (e.status === 401) {
        showError('Ошибка авторизации',
          'Не удалось проверить подпись Telegram. Попробуйте заново.');
      } else {
        showError('Ошибка', e.message || 'Что-то пошло не так.');
      }
    }
  }

  // ============ Выход ============
  async function leaveGame() {
    stopPolling();
    if (roomCode && myUser && myUser.id) {
      try {
        await api(`/api/leave/${roomCode}`, {
          method: 'POST',
          body: JSON.stringify({ user_id: myUser.id }),
        });
      } catch (e) {}
    }
    if (tg) { try { tg.close(); } catch (e) {} }
  }
  function leaveSilently() {
    stopPolling();
    if (roomCode && myUser && myUser.id) {
      fetch(API_BASE + `/api/leave/${roomCode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: myUser.id }),
      }).catch(() => {});
    }
    if (tg) { try { tg.close(); } catch (e) {} }
  }

  // ============ Pointer ============
  function getBoardRect() { return canvas.getBoundingClientRect(); }

  function getPointerPos(e) {
    const isTouch = !!(e.touches && e.touches.length);
    const touch = isTouch ? e.touches[0] : e;
    return {
      x: touch.clientX,
      y: touch.clientY - (isTouch ? FINGER_OFFSET_Y : 0)
    };
  }

  function toCanvasXY(clientX, clientY) {
    const rect = getBoardRect();
    const scaleX = rect.width / (canvas.width / (window.devicePixelRatio || 1));
    const scaleY = rect.height / (canvas.height / (window.devicePixelRatio || 1));
    return {
      x: (clientX - rect.left) / scaleX,
      y: (clientY - rect.top) / scaleY
    };
  }

  function getWallCoordinates(clientX, clientY, orient) {
    const p = toCanvasXY(clientX, clientY);

    let viewC, viewR;
    if (orient === 'h') {
      viewC = Math.floor((p.x - PAD) / CELL);
      viewR = Math.round((p.y - PAD) / CELL) - 1;
    } else {
      viewC = Math.round((p.x - PAD) / CELL) - 1;
      viewR = Math.floor((p.y - PAD) / CELL);
    }

    viewC = Math.max(0, Math.min(N - 2, viewC));
    viewR = Math.max(0, Math.min(N - 2, viewR));

    let r, c;
    if (myPlayer === 1) {
      r = viewR;
      c = viewC;
    } else {
      r = N - 2 - viewR;
      c = N - 2 - viewC;
    }

    const cx = PAD + (viewC + 1) * CELL;
    const cy = PAD + (viewR + 1) * CELL;

    const dist = Math.hypot(p.x - cx, p.y - cy);
    const isInsideBoard = dist < CELL * 1.5;

    const valid = orient === 'h' ? canPlaceHClient(r, c) : canPlaceVClient(r, c);

    return { orient, r, c, viewR, viewC, cx, cy, valid, isInsideBoard };
  }

  function startDrag(e, orient) {
    if (!state || state.gameOver || sending) return;
    if (state.current !== myPlayer) return;
    const myLeft = myPlayer === 1 ? state.left1 : state.left2;
    if (myLeft <= 0) return;

    e.preventDefault();
    const pos = getPointerPos(e);
    const p = toCanvasXY(pos.x, pos.y);

    dragState = {
      orient,
      startX: pos.x,
      startY: pos.y,
      animX: p.x,
      animY: p.y,
      targetX: p.x,
      targetY: p.y,
      preview: null,   // запомненная валидная позиция (объект wallData)
      moved: false
    };

    requestAnimationFrame(animDragLoop);

    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd);
    document.addEventListener('touchcancel', onDragEnd);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  }

  function animDragLoop() {
    if (!dragState) return;
    dragState.animX = lerp(dragState.animX, dragState.targetX, LERP_FACTOR);
    dragState.animY = lerp(dragState.animY, dragState.targetY, LERP_FACTOR);
    if (Math.abs(dragState.animX - dragState.targetX) < 0.3) dragState.animX = dragState.targetX;
    if (Math.abs(dragState.animY - dragState.targetY) < 0.3) dragState.animY = dragState.targetY;
    draw();
    requestAnimationFrame(animDragLoop);
  }

  function onDragMove(e) {
    if (!dragState) return;
    e.preventDefault();

    const pos = getPointerPos(e);
    if (Math.hypot(pos.x - dragState.startX, pos.y - dragState.startY) > 5) {
      dragState.moved = true;
    }

    // Силуэт летит ровно за пальцем
    const p = toCanvasXY(pos.x, pos.y);
    dragState.targetX = p.x;
    dragState.targetY = p.y;

    // Валидную позицию запоминаем, но не «приклеиваем» к ней силуэт
    const wallData = getWallCoordinates(pos.x, pos.y, dragState.orient);
    if (wallData.isInsideBoard && wallData.valid) {
      dragState.preview = wallData;
    }
    // Если сейчас не валидно — preview остаётся прежним (последняя валидная)
  }

  function onDragEnd() {
    if (!dragState) return;
    const ds = dragState;
    dragState = null;

    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend', onDragEnd);
    document.removeEventListener('touchcancel', onDragEnd);
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);

    if (ds.preview && ds.preview.valid && ds.moved) {
      startSendingVisual(ds.preview.orient);
      sendMove({
        type: 'wall',
        orient: ds.preview.orient,
        r: ds.preview.r,
        c: ds.preview.c,
      });
    } else {
      draw();
    }
  }

  function attachDrag(el) {
    const orient = el.dataset.orient;
    const handler = (e) => startDrag(e, orient);
    el.addEventListener('touchstart', handler, { passive: false });
    el.addEventListener('mousedown', handler);
  }

  function startSendingVisual(orient) {
    sending = true;
    myPanel.classList.add('sending');
    myDrags.querySelectorAll('.drag-item').forEach(item => {
      if (item.dataset.orient === orient) item.classList.add('sending');
    });
    refresh();
  }
  function stopSendingVisual() {
    sending = false;
    myPanel.classList.remove('sending');
    myDrags.querySelectorAll('.drag-item').forEach(item => {
      item.classList.remove('sending');
    });
    refresh();
  }

  async function sendMove(action) {
    if (!roomCode) { stopSendingVisual(); return; }
    try {
      const res = await api(`/api/move/${roomCode}`, {
        method: 'POST',
        body: JSON.stringify({ player: myPlayer, action }),
      });
      const newState = { ...state, ...res };
      applyState(newState);
    } catch (e) {
      try { await fetchState(); } catch (e2) {}
    } finally {
      stopSendingVisual();
    }
  }

  function onBoardClick(e) {
    if (!state || state.gameOver || sending) return;
    if (state.current !== myPlayer) return;
    if (dragState) return;

    const touch = e.changedTouches ? e.changedTouches[0] : e;
    const p = toCanvasXY(touch.clientX, touch.clientY);
    const vcol = Math.floor((p.x - PAD) / CELL);
    const vrow = Math.floor((p.y - PAD) / CELL);

    if (vrow < 0 || vrow >= N || vcol < 0 || vcol >= N) return;

    const row = fromViewR(vrow);
    const col = fromViewC(vcol);

    const active = myPlayer === 1 ? state.p1 : state.p2;
    if (row === active[0] && col === active[1]) return;

    const allowed = getAvailableMoves(myPlayer);
    if (allowed.some(([r, c]) => r === row && c === col)) {
      sending = true;
      myPanel.classList.add('sending');
      refresh();
      sendMove({ type: 'move', r: row, c: col });
    }
  }

  // ============ События ============
  btnLeaveGame.addEventListener('click', () => {
    showDialog({
      title: 'Выйти из игры?',
      text: 'Комната закроется для обоих игроков.',
      buttons: [
        { label: 'Отмена' },
        { label: 'Выйти', danger: true, onClick: leaveGame }
      ]
    });
  });

  canvas.addEventListener('click', onBoardClick);
  canvas.addEventListener('touchend', (e) => {
    if (dragState) return;
    if (e.changedTouches.length) {
      const t = e.changedTouches[0];
      onBoardClick({ changedTouches: [t] });
    }
  });

  document.querySelectorAll('.drag-item').forEach(attachDrag);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (canvas.width) { resizeCanvas(); draw(); }
    }, 60);
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if (canvas.width) { resizeCanvas(); draw(); }
    }, 200);
  });

  buildDots(myDotsEl);
  buildDots(enemyDotsEl);

  bootstrap();
})();
</script>
</body>
</html>
